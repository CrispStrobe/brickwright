name: Cowgol integration evidence

on:
  push:
    branches: [feat/cowgol-platforms-qualified-20261128]
    paths: ['.github/workflows/cowgol-producer-sync.yml']

permissions:
  contents: read

concurrency:
  group: cowgol-final-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    if: ${{ github.repository == 'CrispStrobe/brickwright' && github.ref == 'refs/heads/feat/cowgol-platforms-qualified-20261128' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Confirm the qualified supplier snapshot and prepare report dependencies
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          assert.equal(JSON.parse(fs.readFileSync('vendor-pins.json'))['sb3-creator'],
            'edd30b11967747774cfddd01f8eb888509866c5c');
          execFileSync('git', ['merge-base', '--is-ancestor',
            '301316b0736180ee84bedb4439b8f33689f65bd3', 'HEAD']);
          const {SB3_CREATOR_FILES} = await import('./scripts/lib/vendor-rewrites.mjs');
          const appOwned = 'bw-lang/cowgol-compile.js';
          assert.ok(!SB3_CREATOR_FILES.some(([local]) => local === appOwned),
            'the editor compiler router must remain outside the producer source map');
          assert.equal(execFileSync('git', ['rev-parse',
            'HEAD:overlay/scratch-gui/src/lib/' + appOwned], {encoding: 'utf8'}).trim(),
            '5a9e745ae7fdce4835829fa69ee5a693f8e95616',
            'the one app-owned exception must be the reviewed compiler router');
          execFileSync('git', ['diff', '--exit-code',
            '301316b0736180ee84bedb4439b8f33689f65bd3', 'HEAD', '--',
            'vendor-pins.json', 'scripts/lib/vendor-rewrites.mjs', 'scripts/lib/vendor',
            'overlay/scratch-gui/src/lib', 'packages/scratch-gui/src/lib',
            'overlay/scratch-gui/examples',
            ':(top,exclude,literal)overlay/scratch-gui/src/lib/' + appOwned], {stdio: 'inherit'});
          NODE
          npm install --prefix .cowgol-evidence-deps --ignore-scripts --no-save --package-lock=false jszip@3.10.1 acorn@8.14.0 acorn-walk@8.3.4
          ln -s .cowgol-evidence-deps/node_modules node_modules
      - name: Generate reader coverage and qualify the final workflow set
        run: |
          set -euo pipefail
          node scripts/gen-reader-coverage.mjs
          git rm -- .github/workflows/cowgol-producer-sync.yml
          for workflow in cowgol.yml cardiac-lab.yml cp1-qualification.yml kim1-app.yml kim1-prepare.yml reference-qualified-instrument-controls.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 20 \
              --json headSha,status,conclusion \
              --jq '.[] | select(.status == "completed" and .conclusion != "cancelled") | .headSha' \
              > "$RUNNER_TEMP/cowgol-census-source-shas.txt"
            while IFS= read -r revision; do
              [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
              if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$revision"
              fi
            done < "$RUNNER_TEMP/cowgol-census-source-shas.txt"
            node scripts/gen-ci-steps.mjs --fetch --workflow "$workflow"
          done
          node scripts/gen-ci-steps.mjs --check
      - name: Verify the focused app gates and exact CLI refusal behavior
        run: |
          node scripts/check-mirrors.mjs
          node scripts/audit-gate-shapes.mjs --json > "$RUNNER_TEMP/cowgol-gate-shapes.json"
          node scripts/aggregate-timeouts.mjs --census --json > "$RUNNER_TEMP/cowgol-wait-census.json"
          node --test \
            test/gate-shapes.test.mjs \
            test/gate-coverage.test.mjs \
            test/gate-direct-exec.test.mjs \
            test/fetch-pinning.test.mjs \
            test/ci-step-census.test.mjs \
            test/reader-coverage-doc.test.mjs \
            test/workflow-step-shape.test.mjs \
            test/ci-workflow-inputs.test.mjs \
            test/wait-census.test.mjs \
            test/build-trigger-paths.test.mjs \
            test/cowgol-verifier-cli.test.mjs \
            test/cowgol-native-surfaces.test.mjs
      - name: Record the qualified final tree and save only generated evidence
        run: |
          set -euo pipefail
          git add -- docs/generated/READER-COVERAGE.md docs/generated/ci-step-census.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          const temporary = '.github/workflows/cowgol-producer-sync.yml';
          assert.equal(fs.existsSync(temporary), false);
          const changed = git('diff', '--cached', '--name-only').split('\n').filter(Boolean);
          const allowed = new Set([temporary, 'docs/generated/READER-COVERAGE.md',
            'docs/generated/ci-step-census.json']);
          assert.deepEqual(changed.filter(path => !allowed.has(path)), []);
          assert.deepEqual(git('diff', '--cached', '--diff-filter=D', '--name-only').split('\n').filter(Boolean),
            [temporary], 'only the one-use workflow may be removed');
          assert.equal(git('diff', '--name-only'), '', 'no unstaged tracked mutation may escape the qualified tree');
          const qualifiedTree = git('write-tree');
          const roots = git('ls-tree', '--name-only', 'HEAD').split('\n');
          assert.deepEqual(git('ls-tree', '--name-only', qualifiedTree).split('\n'), roots);
          const report = {
            sourceSnapshot: '301316b0736180ee84bedb4439b8f33689f65bd3',
            producer: 'edd30b11967747774cfddd01f8eb888509866c5c',
            supplierSnapshot: 'Exact pins, mapped sources, vendor transforms and gallery retained.',
            appOwnedRouter: 'bw-lang/cowgol-compile.js is outside the producer map; qualified in the exact candidate tests.',
            candidate: git('rev-parse', 'HEAD'), qualifiedTree, rootEntries: roots.length,
            changedFiles: changed, readerCoverage: 'passed', workflowCensus: 'passed',
            focusedAppGates: 'passed', verifierCli: 'passed',
            finalization: 'Root must remove only the temporary workflow and reproduce qualifiedTree exactly.'
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/cowgol-final-evidence.json',
            JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report));
          NODE
          # Keep this token's push restricted to generated documents. The owning
          # caller removes the temporary workflow and verifies qualifiedTree.
          git restore --source=HEAD --staged --worktree -- .github/workflows/cowgol-producer-sync.yml
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const paths = execFileSync('git', ['diff', '--cached', '--name-only'],
            {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed = new Set(['docs/generated/READER-COVERAGE.md', 'docs/generated/ci-step-census.json']);
          assert.ok(paths.length, 'the missing workflow observations must be saved');
          assert.deepEqual(paths.filter(path => !allowed.has(path)), []);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh Cowgol reader and workflow evidence'
          git push origin HEAD:refs/heads/feat/cowgol-platforms-qualified-20261128
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cowgol-final-evidence
          path: |
            ${{ runner.temp }}/cowgol-final-evidence.json
            ${{ runner.temp }}/cowgol-gate-shapes.json
            ${{ runner.temp }}/cowgol-wait-census.json
            docs/generated/READER-COVERAGE.md
            docs/generated/ci-step-census.json
