        run: node --import ./scripts/lib/register-gui-scope.mjs scripts/verify-arcade-controller-repeat-authoring-gui.mjs
      - name: Retain admission and journey failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
