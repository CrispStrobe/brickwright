name: Build (permissive base)
on:
  workflow_dispatch:
  # TWO TIERS (owner decision 2026-10-14). Every PR push gets the FAST tier
  # (unit shards, build, corpus); the THOROUGH tier (browser light/heavy, fpga
  # surface) runs on main pushes, workflow_dispatch, and PRs labelled ci:full.
  # `labeled`/`unlabeled` start a run that does only what the label changes
  # (the thorough tier, and the `full CI requested` verdict), so no job runs
  # twice for one commit. A documentation-only PR (judged by the push `paths:`
  # filter below, see scripts/ci-docs-only.mjs) runs neither code tier.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
    # A LEDGER ROW IS NOT A BUILD, and until now every one started a full
    # vendor -> install -> build -> Playwright run.
    #
    # Measured on 2026-08-25: main took 12 pushes between 12:00 and 13:20 and
    # got ZERO verdicts. `concurrency: pages-<ref>` keeps one run per ref, so
    # each new push superseded the pending one and the older run came back
    # `cancelled` — which reads like somebody chose to stop it. Nine of those
    # twelve pushes changed nothing but LANES.md. The queue behind them also
    # starved `vendor-freshness`, whose runs sat queued and never started.
    #
    # WHY THIS IS A LIST AND NOT `**.md`. sb3-creator's ci.yml can use the
    # blanket glob; lite cannot, and copying it here would silently switch off
    # gates that can genuinely go red:
    #
    #   overlay/scratch-gui/examples/**/intro.md   SHIPPED CONTENT. webpack
    #     copies `examples` wholesale into build/, and ExamplesBrowser.jsx
    #     fetches `examples/<dir>/intro.md` at runtime.
    #   overlay/scratch-gui/examples/**/EXPECTED.md   TEST INPUT. The lesson
    #     claim gates read these; wave7 asserts on ttl-clock-module's text.
    #   THIRD-PARTY-NOTICES.md   TEST INPUT, and a licence one. Three tests
    #     readFileSync it and assert a dependency is named in it.
    #   docs/generated/**, docs/schematic-baselines/**   TEST INPUT, read through
    #     CONSTRUCTED paths no name census can see. Safe only because the
    #     one-level `!docs/*.md` below never reaches a subdirectory — that depth
    #     is load-bearing, and the test refuses a constructed TOP-LEVEL path.
    #
    # This is a `paths` filter (everything, minus what nothing reads) rather
    # than `paths-ignore`, because `paths-ignore` cannot say "except". The
    # root prose is negated by name; `docs/*.md` is negated as a whole and then
    # every doc some NON-COMMENT line of test/, scripts/, .github/ or overlay/
    # mentions is put back — mention, not read, so the rule errs toward
    # building. bw-ci measured the gap on 2026-09-05: 41 of 47 docs read by
    # nothing, each edit to one a full build slot on a day nine of twenty main
    # builds were cancelled. The re-include list below is NOT hand-maintained:
    # test/build-trigger-paths.test.mjs (scripts/lib/doc-triggers.mjs) computes
    # the mentioned set from the tree and fails by name when a mentioned doc is
    # missing here or a listed one is mentioned nowhere. Two lines that name a
    # doc do not count: a workflow's own trigger entry (until 2026-09-07 this
    # list vouched for itself and "stale" could never fire — two docs whose
    # readers had left stayed here), and a name printed as markdown inside a
    # generator's template literal (two generators name the plan that way;
    # five main runs on 2026-09-07 verified plan-only edits). Census
    # 2026-09-07: 15 mentioned; the rest of docs/*.md skip.
    # 2026-09-21: 16 — EXAMPLE-CORPUS-FINDINGS.md joined when
    # test/corpus-findings-are-current.test.mjs began reading it.
    # 2026-09-21: 16. RCX-FIRMWARE.md is named by a code line in
    # lib/rcx-download-hook.js — the string a user reads when the brick does
    # not answer — which is what makes it a trigger. RCX-IR-PROTOCOL.md was
    # here for a few hours and is not any more: its only code mention was a
    # KNOWN_DEAD reason, and that entry went when the module got a caller.
    # The list tracks what code NAMES, so it shrinks as well as grows.
    # 2026-09-20: 16 — SPIKE-CONSOLIDATION.md, named by the spikeprime bundle.
    # 2026-09-26: 17 — LEGO-ARCHITECTURE.md gained an executable status contract.
    # 2026-09-28: 19 — TARGET-EMULATOR-PERFORMANCE.md, read by
    # test/target-checkpoint-ledger.test.mjs. It arrived with
    # target-performance.yml (#453) and, like that workflow's census entry,
    # without the record that has to move with it — so editing the doc that
    # test reads would not have rerun it.
    # 2026-09-28: 18 — APP-STORE-COMPLIANCE.md. It arrived with
    # test/app-store-compliance-bundle.test.mjs and
    # scripts/package-store-compliance.mjs, both of which NAME it, but was
    # left under the `!docs/*.md` negation — so editing the doc those two
    # read would not have rebuilt or retested them. Caught by
    # test/build-trigger-paths.test.mjs, which is the whole point of it.
    # 2026-10-17: ROBOT-LAB-ARCHITECTURE.md, named by
    # scripts/migrate-parts-v2.mjs and parts.json's $comment (Robot Lab R2).
    #
    # A skipped run means no Pages deploy for that push. That is correct: the
    # app is byte-identical, and deploy-daily republishes regardless.
    paths:
      - '**'
      - '!BLOCKED.md'
      - '!BUILD.md'
      - '!CI-POINTERS.md'
      - '!CLAUDE.md'
      - '!HANDOFF.md'
      - '!HISTORY.md'
      - '!LANES.md'
      - '!MBIT-BUILD.md'
      - '!PLAN.md'
      - '!README.md'
      - '!ROADMAP.md'
      # lane claims, one file each since 2026-10-20 (LANES.md is their header)
      - '!lanes/*'
      - '!docs/*.md'
      - 'docs/APP-STORE-COMPLIANCE.md'
      - 'docs/TARGET-EMULATOR-PERFORMANCE.md'
      - 'docs/CYCLE-ACCURATE-CORE-EVALUATION.md'
      - 'docs/EXAMPLE-CORPUS-FINDINGS.md'
      - 'docs/EXTENSION-SECURITY.md'
      - 'docs/FETCH-PINNING.md'
      - 'docs/LESSON-ACHIEVABILITY-SWEEP.md'
      - 'docs/LESSON-REVIEW-WAVE-2.md'
      - 'docs/LESSON-REVIEW-WAVE-3.md'
      - 'docs/LESSON-REVIEW-WAVE-4.md'
      - 'docs/LESSON-REVIEW-WAVE-5.md'
      - 'docs/LESSON-REVIEW-WAVE-6.md'
      - 'docs/LESSON-REVIEW-WAVE-7.md'
      - 'docs/LEGO-ARCHITECTURE.md'
      - 'docs/PICO-KALUMA-BOOT.md'
      - 'docs/PEERS-SECURITY-REVIEW.md'
      - 'docs/RCX-FIRMWARE.md'
      - 'docs/ROBOT-CAD-EDITOR-PARITY.md'
      - 'docs/ROBOT-LAB-ARCHITECTURE.md'
      - 'docs/ROBOT-LAB-VALIDATION.md'
      - 'docs/SPIKE-CONSOLIDATION.md'
      - 'docs/SIM-LAB-PLAN.md'
      - 'docs/SPIKE-ARENA.md'
      - 'docs/SPIKE-FIRMWARE-PROGRAMS.md'
      - 'docs/TARGET-EMULATOR-PERFORMANCE.md'
      - 'docs/VENDOR-DIVERGENCE-SB3-CREATOR.md'
      - 'docs/WAVE-OPEN-DEFECTS.md'
      - 'docs/app-store-metadata.md'
      - 'docs/ARCADE-888-OPEN-FAILURES.md'
      - 'docs/ARCADE-CLASS-LINEAGE.md'
permissions:
  contents: read
  pages: write
  id-token: write
# Keep one main validation running to completion while coalescing pending main
# pushes to the latest commit. Cancelling the active run on every merge starved
# Pages: on 2026-11-14 run 43556902511 had passed build, corpus and seven unit
# shards before the next push cancelled its remaining gates. The runner queue
# made every main run vulnerable before it could reach publication.
#
# Pending main runs may still be superseded (GitHub retains only one pending
# entry per group). This bounds the backlog without discarding active work.
# The superseded guard still skips an obsolete run's heavy tail when it starts;
# deploy still serializes publication and refuses to publish an older tree.
# PRs keep latest-push cancellation and separate label-event groups. Manual,
# tag and other non-code events retain their isolated run groups.
concurrency:
  group: ${{ github.workflow }}${{ !(github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request')) && format('-isolated-{0}', github.run_id) || '' }}-${{ github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('label-{0}', github.event.label.name) || 'code' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
jobs:
  # CHANGE SCOPE. Decides the tiers once, for every job below.
  #   fast     — unit shards, build, corpus: every non-label event, unless the
  #              PR is documentation-only.
  #   thorough — browser, fpga surface: any non-PR event (main push, dispatch);
  #              on a PR only for code changes carrying ci:full (or the run the
  #              `labeled: ci:full` event starts).
  # Non-PR events are never docs-only here: push already has its paths filter.
  # PATH-AWARE SHARDS (owner request 2026-10-20). On a PR the thorough tier runs
  # only the shards scripts/ci-browser-scope.mjs says the changed files reach
  # (heavy, light, robotlab, fpga): none for tests, Rust/Tauri, the CLI, docs
  # and scripts no gate reaches; one shard for paths only it exercises (bw-sim
  # and sim-lab -> robotlab); EVERY shard for shared or unknown paths. ci:full
  # with no shard needed still runs every shard (an explicit request). Main
  # pushes, dispatches and schedules run every shard, so a wrong skip is caught
  # right after merge.
  scope:
    name: change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
      fast: ${{ steps.tier.outputs.fast }}
      thorough: ${{ steps.tier.outputs.thorough }}
      full_label: ${{ steps.tier.outputs.full_label }}
      browser: ${{ steps.tier.outputs.browser }}
      heavy: ${{ steps.tier.outputs.heavy }}
      light: ${{ steps.tier.outputs.light }}
      robotlab: ${{ steps.tier.outputs.robotlab }}
      fpga: ${{ steps.tier.outputs.fpga }}
      browser_needed: ${{ steps.files.outputs.any }}
      browser_summary: ${{ steps.files.outputs.summary }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - id: files
        name: Classify the changed files (docs-only by the push paths filter)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[] | .filename, (.previous_filename // empty)' > /tmp/changed.txt
          node scripts/ci-docs-only.mjs < /tmp/changed.txt >> "$GITHUB_OUTPUT"
          node scripts/ci-browser-scope.mjs < /tmp/changed.txt | sed 's/^/scope_/; s/^scope_browser=/browser=/; s/^scope_any=/any=/; s/^scope_summary=/summary=/' >> "$GITHUB_OUTPUT"
      - id: tier
        name: Decide the fast and thorough tiers
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          DOCS_ONLY: ${{ steps.files.outputs.docs_only }}
          NEED_HEAVY: ${{ steps.files.outputs.scope_heavy }}
          NEED_LIGHT: ${{ steps.files.outputs.scope_light }}
          NEED_ROBOTLAB: ${{ steps.files.outputs.scope_robotlab }}
          NEED_FPGA: ${{ steps.files.outputs.scope_fpga }}
          NEED_LIGHTCAD1: ${{ steps.files.outputs.scope_lightcad1 }}
          NEED_LIGHTCAD2: ${{ steps.files.outputs.scope_lightcad2 }}
          NEED_LIGHTCAD3: ${{ steps.files.outputs.scope_lightcad3 }}
          NEED_LIGHTARTWORK: ${{ steps.files.outputs.scope_lightartwork }}
          NEED_ROBOTVIEW: ${{ steps.files.outputs.scope_robotview }}
        run: |
          set -euo pipefail
          fast=true; thorough=true
          # These proof shards use the existing light and Robot Lab tier families.
          # Aggregate before exclusions, including PRs that also change another family.
          if [ "$NEED_LIGHTCAD1" = "true" ] || [ "$NEED_LIGHTCAD2" = "true" ] || [ "$NEED_LIGHTCAD3" = "true" ] || [ "$NEED_LIGHTARTWORK" = "true" ]; then NEED_LIGHT=true; fi
          if [ "$NEED_ROBOTVIEW" = "true" ]; then NEED_ROBOTLAB=true; fi
          # Per shard: every shard on non-PR events, and on a ci:full PR whose
          # files need none (the label is then an explicit request for all).
          heavy=true; light=true; robotlab=true; fpga=true
          if [ "$EVENT" = "pull_request" ] && [ "$NEED_HEAVY$NEED_LIGHT$NEED_ROBOTLAB$NEED_FPGA" != "falsefalsefalsefalse" ]; then
            heavy="${NEED_HEAVY:-true}"; light="${NEED_LIGHT:-true}"; robotlab="${NEED_ROBOTLAB:-true}"; fpga="${NEED_FPGA:-true}"
          fi
          if [ "$EVENT" = "pull_request" ]; then
            if [ "$DOCS_ONLY" = "true" ]; then fast=false; thorough=false
            elif [ "$ACTION" = "labeled" ] || [ "$ACTION" = "unlabeled" ]; then
              fast=false
              if [ "$ACTION" = "labeled" ] && [ "$LABEL" = "ci:full" ]; then thorough=true; else thorough=false; fi
            elif [ "$HAS_FULL" = "true" ]; then thorough=true
            else thorough=false
            fi
          fi
          if [ "$thorough" != "true" ]; then heavy=false; light=false; robotlab=false; fpga=false; fi
          browser=false
          if [ "$heavy" = "true" ] || [ "$light" = "true" ] || [ "$robotlab" = "true" ]; then browser=true; fi
          echo "fast=$fast thorough=$thorough docs_only=$DOCS_ONLY event=$EVENT/$ACTION shards: heavy=$heavy light=$light robotlab=$robotlab fpga=$fpga"
          { echo "fast=$fast"; echo "thorough=$thorough"; echo "full_label=$HAS_FULL"
            echo "browser=$browser"; echo "heavy=$heavy"; echo "light=$light"; echo "robotlab=$robotlab"; echo "fpga=$fpga"; } >> "$GITHUB_OUTPUT"

  # ADMISSION DISCIPLINE. Fast PR qualification is the default. This check
  # admits an actual selected tier or docs-only scope, never label presence
  # alone. Every enabled selected job must still succeed before merge.
  full-ci-gate:
    name: full CI requested
    if: github.event_name == 'pull_request'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Admit selected CI tier
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          FAST: ${{ needs.scope.outputs.fast }}
          THOROUGH: ${{ needs.scope.outputs.thorough }}
        run: |
          set -euo pipefail
          for value in "$DOCS_ONLY" "$FAST" "$THOROUGH"; do
            case "$value" in
              true|false) ;;
              *) echo "::error::missing or invalid selected CI tier"; exit 1 ;;
            esac
          done
          if [ "$DOCS_ONLY" = "true" ]; then echo "documentation-only change: no code tier required"; exit 0; fi
          if [ "$FAST" = "true" ]; then echo "fast tier selected: require every enabled check to succeed"; exit 0; fi
          if [ "$THOROUGH" = "true" ]; then echo "thorough tier selected: require every enabled check to succeed"; exit 0; fi
          echo "::error::code change has no selected CI tier"
          exit 1

  # SUPERSEDED MAIN COMMITS RUN CHEAP. Measured 2026-09-29: main took 100 commits
  # in 24 h, each run is 6 jobs, and one run is ~36 min of job time (browser
  # light 12, build 11, browser heavy 9, fpga 3, corpus 1). That is ~60 job-hours
  # a day for main alone on a pool shared with bw-board and bw-circuit-ui, and on
  # 2026-09-28 it produced 78 queued runs against ONE executing — every PR in the
  # repo starved, and bw-board's CI with it, which in turn reddened lite through
  # verify-bw-board-ci. Per-commit full verdicts are not merely expensive at this
  # rate, they cannot be served.
  #
  # This guard never cancels active work. The workflow now coalesces pending
  # main pushes in one group while allowing the active validation to finish.
  #
  # Instead: a commit that is no longer main's tip by the time its run starts
  # still gets `build`, all eight `unit` shards and `corpus` (source and unit verdicts
  # remain attributable to that commit), and skips the heavy tail —
  # browser, fpga-surface, deploy, verify-gui — which the tip's own run re-covers
  # anyway, unless main advanced only through excluded documentation (which has
  # NO replacement Build). That case retains the full tail. ~24 of the ~36 min,
  # while retaining the source verdicts from any active validation.
  #
  # PRs are never superseded by this: the check is main-only and defaults to
  # running everything.
  guard:
    name: superseded check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      superseded: ${{ steps.check.outputs.superseded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "not a main push — nothing to supersede"
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/verify-vercel-main-checks.mjs "$SHA" --superseded >> "$GITHUB_OUTPUT"

  # Each shard retains identical integrated prerequisites and its own audited
  # file/skip/GUI-resolution census. No Pages artifact is produced here.
  unit:
    name: unit (${{ matrix.shard }}/8)
    needs: scope
    if: needs.scope.outputs.fast == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Require green upstream evidence for the pinned 8086 engine
        # Authenticated: verify-bw-board-ci.mjs reads GH_TOKEN. Without it every runner
        # shares GitHub's anonymous per-IP limit and this step dies with HTTP 403 on a
        # busy night (2026-09-06, twice in one hour), which paints a rate limit and a red
        # bw-board the same colour.
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:bwboard-ci
      - name: Install source-test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Fast, tracked-source verdict before vendor/integrate/install spend. The
      # generated GUI suite below remains the authoritative release verdict.
      - name: Run bounded source-only tests
        run: npm run test:source
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the Code tab (sb3-creator)
        run: node scripts/integrate.mjs
      # Same static asset Vercel deploys, so the browser gate below runs against the
      # shape users get rather than one where the heavy tier is silently missing.
      # Non-fatal on purpose: if the release fetch fails, the engine is simply not
      # offered — lib/labwired-engine.js already answers null instead of throwing,
      # and the gate covers that degraded path too.
      - name: Fetch the heavy simulation engine (labwired-wasm)
        run: node scripts/sync-labwired-wasm.mjs || echo "labwired-wasm unavailable — the heavy tier will not be offered"
      - name: Fetch pinned ESP32-S3 ROM assets
        id: esp32s3_rom_assets
        run: node scripts/sync-esp32s3-roms.mjs || echo "ESP32-S3 ROM assets unavailable — merged-flash boot will report the missing assets"
      - name: Install
        run: |
          set -euo pipefail
          (cd packages/scratch-gui && npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund)
          git diff --exit-code -- packages/scratch-gui/package.json packages/scratch-gui/package-lock.json
      # The deployable build below is flag-ON, and flag-on webpack aliases
      # @yowasp/yosys to the REAL package (an off build gets the yosys-absent stub),
      # so the local FPGA tier's worker resolves. ~75 MB, in the deploy build only.
      - name: Install the local FPGA toolchain (the deployable build is flag-on)
        run: |
          set -euo pipefail
          (cd packages/scratch-gui && npm install --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund @yowasp/yosys)
          git diff --exit-code -- packages/scratch-gui/package.json packages/scratch-gui/package-lock.json
      - name: Apply the scratch-vm overlay (built-in extensions)
        run: node scripts/apply-vm-overlay.mjs
      # The FPGA surface ships in the DEPLOYABLE build (BW_ENABLE_FPGA=1 above),
      # behind a per-user opt-in (Settings ▸ FPGA lab, default off) and lazily
      # loaded so it stays out of first paint — verify-boot-payload proves the
      # heavy libs are not eager. The BROWSER-gate build below stays flag-off, so
      # this parse still guards the flagged JSX for that path — cheap, and it also
      # catches a syntax error before the deploy build reaches it.
      - name: Parse the flagged JSX
        run: node scripts/check-flagged-jsx.mjs
      # Everything from here to `Serve the built app` is an INDEPENDENT check —
      # guards, unit tests, the lazy-bundle inspection, the debugger smoke test.
      # None of them produces an input the next one needs, so none of them should
      # silence the next one. They hang off this id, the last step of the actual
      # prerequisite chain (vendor -> integrate -> install -> overlays).
      - name: Apply the scratch-paint overlay (extended costume designer)
        run: node scripts/apply-paint-overlay.mjs
      # One patch: text costumes wait for the lazy render-fonts chunk (ROADMAP §2.4).
      - name: Apply the scratch-render overlay (lazy render fonts)
        id: overlays
        run: node scripts/apply-render-overlay.mjs

      # --- guards: catch silent reverts before the build runs ---
      #
      # Falsified 2026-08-09 on branch guard-falsification (deleted):
      #   1. stc12 truncated to 4 opcodes → CAUGHT (run 31312830786)
      #      "Bundled stc12 has only 4 opcodes (need ≥10)"
      #   2. PIN=2f896b1a with matching binary → CAUGHT (run 31312945118)
      #      "WASM PIN is not a descendant of the crash-fix floor (85ed23d)"
      #      Proved the floor check, not a single-hash blacklist.
      #   3. blocks.jsx null-guard removed → CAUGHT (run 31313002380)
      #      "blocks.jsx is missing the toolbox null-guard"
      #      Exact replay of the 0ba092b revert that caused the live outage.
      #   4. HOC throw (unknown GUI crash) → CAUGHT (run 31331264070)
      #      "FAIL: GUI did not render" — all 3 static guards passed, only the
      #      headless browser check caught it. Proved it catches unknown causes,
      #      not just the three named regressions. Branch: guard4-falsification.

      - name: Guard — bundled stc12 has all emitted opcodes
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          FILE=overlay/scratch-vm/src/extensions/crispstrobe/stc12/index.js
          # `grep -o | wc -l` counts OCCURRENCES; `grep -c` counts LINES that
          # match. The bundles are one long line now — they hold the extension
          # as a JSON string rather than a template literal, because a stray
          # backtick in a comment closed the template early twice (711e4744f,
          # 2258847c1). With `grep -c` this guard read 30 opcodes as 1 and
          # failed a correct tree.
          COUNT=$(grep -o 'opcode:' "$FILE" | wc -l | tr -d ' ')
          echo "stc12 opcodes: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::Bundled stc12 has only $COUNT opcodes (need ≥10). Was it rebuilt from the gallery?"
            exit 1
          fi

      - name: Guard — WASM pin is a descendant of the crash-fix floor
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          # The floor: 85ed23d94a1fbf8a15c2ddff068d438a832913cc is the commit
          # with the emu_init crash fix and corrected BUILD-INFO.md. Any pin
          # older than this ships a crashing binary. Bump the floor when a
          # newer build is deliberately adopted.
          #
          # Full 40-hex, like the PIN it is compared against: an abbreviation is
          # unique only within one repo at one moment, and `--is-ancestor` given
          # an ambiguous or unknown rev fails in a way this step reads as "not a
          # descendant" — a true-looking error about the wrong thing.
          FLOOR=85ed23d94a1fbf8a15c2ddff068d438a832913cc
          PIN=$(node -e "
            const src = require('fs').readFileSync('scripts/sync-emu8051-wasm.mjs','utf8');
            const m = src.match(/const PIN = '([^']+)'/);
            console.log(m ? m[1] : '');
          ")
          echo "PIN=$PIN  FLOOR=$FLOOR"
          if [ -z "$PIN" ]; then
            echo "::error::Could not extract PIN from sync-emu8051-wasm.mjs"
            exit 1
          fi
          # Clone just enough of emu8051-stc to check ancestry
          git clone --bare --filter=blob:none https://github.com/CrispStrobe/emu8051-stc.git /tmp/emu8051-stc.git 2>/dev/null
          if ! git -C /tmp/emu8051-stc.git merge-base --is-ancestor "$FLOOR" "$PIN" 2>/dev/null; then
            echo "::error::WASM PIN ($PIN) is not a descendant of the crash-fix floor ($FLOOR). Re-pin to $FLOOR or later."
            exit 1
          fi
          echo "PIN is at or after the floor — good"
          node scripts/sync-emu8051-wasm.mjs --check

      - name: Guard — blocks.jsx has the toolbox null-guard
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          # The crash: blocks.jsx passes this.props.toolboxXML to ScratchBlocks.inject().
          # toolboxXML is null at startup (deferred because scratch-blocks is lazy-loaded).
          # Without the null-guard, inject() gets null and the GUI doesn't mount.
          FILE=overlay/scratch-gui/src/containers/blocks.jsx
          if ! grep -q 'this.props.toolboxXML || makeToolboxXML' "$FILE"; then
            echo "::error::blocks.jsx is missing the toolbox null-guard (this.props.toolboxXML || makeToolboxXML). GUI will not render."
            exit 1
          fi
          echo "blocks.jsx: toolbox null-guard present (good)"

      # --- tests ---

      - name: Gate — independent SPIKE runtime with retired firmware assets absent
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        env:
          BW_SPIKE_RECEIPT_DIR: ${{ runner.temp }}/spike-runtime-receipts
        run: node scripts/verify-independent-spike.mjs

      # Milestone 0: the shipped example corpus must be proven to EXECUTE, and
      # the gate that proves it must be present and must still be able to fail.
      # `npm test` below runs both gates through its glob; this step exists so a
      # deleted gate, or a ratchet quietly padded until nothing is red any more,
      # is a build failure and not an absence nobody notices. Both failure modes
      # have happened in this repo: five gates were found that could not fail,
      # and a dead-module exclusion list grew from five entries to sixteen while
      # staying green.
      #
      # Mutation-proven 2026-08-23 (docs/EXAMPLE-CORPUS-FINDINGS.md, seven
      # mutations): breaking a shipped example, deleting an opcode from a
      # bundled extension, padding a ratchet, and removing the corpus each make
      # the gate red.
      - name: Guard — the example execution gates exist and their ratchets have not grown
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          set -e
          for gate in test/example-vm-execution.test.mjs test/example-execution.test.mjs; do
            if [ ! -f "$gate" ]; then
              echo "::error::$gate is missing — the shipped example corpus would be unproven"
              exit 1
            fi
          done
          # A waiver list may only shrink. Lower these as examples are fixed,
          # never raise them. All four example waivers are now ZERO, so these
          # ceilings are zero: any reappearance is a regression, not a budget to
          # spend. KNOWN_INERT 4 -> 0 and KNOWN_MISSING_OPCODES -> 0 when the
          # eleven devices_oled*/devices_tft* opcodes were defined (37 -> 48
          # blocks); KNOWN_SHADOWED_WRITES 19 -> 0 and KNOWN_NO_BLOCKS 2 -> 0 with
          # the sb3-creator pin bump to 1a83dfa. TIME_GATED is NOT a waiver list
          # -- its entries still carry a static assertion -- but it is capped too,
          # so it cannot quietly become one.
          node -e "
            const fs = require('fs');
            // Strip line comments before counting. The counter looks for quoted
            // strings, and a stray apostrophe in prose reads as a quoted span —
            // it reported an entry in a list with none. A guard that miscounts is
            // worse than no guard, so it does not get to read prose.
            const gate = fs.readFileSync('test/example-vm-execution.test.mjs', 'utf8')
              .split('\n').map(l => l.replace(/^\s*\/\/.*$/, '')).join('\n');
            // A Set entry is 'id'; a Map entry is ['id', 'reason'] and would
            // otherwise count double. Count the id, whichever shape it is in.
            const count = (name) => {
              const at = gate.indexOf(name);
              if (at < 0) { console.error('::error::' + name + ' is gone from the gate'); process.exit(1); }
              const isMap = /new Map\(/.test(gate.slice(at, at + 40));
              const body = gate.slice(gate.indexOf('[', at), gate.indexOf(isMap ? '])' : ']', at));
              return (body.match(isMap ? /\['[^']+'/g : /'[^']+'/g) || []).length;
            };
            const ceilings = {KNOWN_INERT: 0, KNOWN_SHADOWED_WRITES: 0, KNOWN_NO_BLOCKS: 0, TIME_GATED: 2};
            let bad = 0;
            for (const [name, ceiling] of Object.entries(ceilings)) {
              const n = count(name);
              console.log(name + ': ' + n + ' waived (ceiling ' + ceiling + ')');
              if (n > ceiling) {
                console.error('::error::' + name + ' grew to ' + n + ' entries (ceiling ' + ceiling +
                  '). A waiver list may only shrink.');
                bad++;
              }
            }
            const undefinedOpcodes = (gate.slice(gate.indexOf('KNOWN_MISSING_OPCODES'),
              gate.indexOf('KNOWN_INERT')).match(/'[a-z0-9]+_[a-z0-9_]+'/g) || []).length;
            console.log('KNOWN_MISSING_OPCODES: ' + undefinedOpcodes + ' opcodes waived (ceiling 0)');
            if (undefinedOpcodes > 0) {
              console.error('::error::KNOWN_MISSING_OPCODES grew to ' + undefinedOpcodes + ' opcodes.');
              bad++;
            }
            process.exit(bad ? 1 : 0);
          "

      - name: Guard — the fetch-pinning gate exists and can still fail
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          set -e
          # `npm test` below runs test/fetch-pinning.test.mjs through its glob.
          # This step exists for the two failure modes a green suite cannot
          # distinguish from a passing gate: the gate DELETED, and the gate
          # unable to go red. Both have happened in this repo — five gates were
          # found that could not fail, and one of them walked a tree containing
          # its own prover, so every string-literal target matched itself.
          #
          # The prover mutates tracked files and reverts each in a finally
          # block; it exits 2 if the tree does not come back green, so a failed
          # revert cannot be mistaken for a passing run.
          if [ ! -f test/fetch-pinning.test.mjs ]; then
            echo "::error::test/fetch-pinning.test.mjs is missing — every fetch in this repo would be unchecked"
            exit 1
          fi
          # No `git diff` here. By this point `npm install`, vendor and integrate
          # have modified thousands of tracked files, so a dirty tree says
          # nothing about the prover — and the first version of this step
          # reported "the pinning prover left the tree dirty" after the prover
          # had just printed 11/11 caught (run 32762117022). A well-formed,
          # confident statement about the wrong thing, in the step meant to
          # catch exactly that. The prover checks its own restoration at BYTE
          # level against what each file held before it touched it, which is
          # the question, and exits 2 if a revert failed.
          node scripts/prove-fetch-pinning.mjs

      # Three checks that read example JSON off disk — no browser, no server,
      # no built app. They were sitting unrun with the browser gates purely
      # because of their filename, and they cost about a second each.
      - name: Content gates — faceplates, hub faces, retro console
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          node scripts/verify-faceplate-blinkenrocket.mjs
          node scripts/verify-lego-hub-faces.mjs
          node scripts/verify-retro-console.mjs

      # test/pin-move-chain.test.mjs (plan T9) needs two histories the default
      # checkout does not have: this repo's own, for every value vendor-pins.json
      # ever held (depth-1 sees one commit and the half would pass on an empty
      # set — the test refuses that by name), and the vendored repos', so a sha of
      # theirs that was never a pin is caught too. Both without blobs: the
      # unshallow measured 3.2 s on a CI-shaped clone, each bare clone ~1 s.
      - name: Vendored-repo history for the pin-move gate
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --quiet --unshallow --filter=blob:none origin
          fi
          echo "vendor-pins.json history: $(git rev-list --count HEAD -- vendor-pins.json) commits"
          mkdir -p "$RUNNER_TEMP/vendor-history"
          for repo in bw-board sb3-creator bw-circuit-ui; do
            git clone --quiet --bare --filter=blob:none "https://github.com/CrispStrobe/$repo.git" "$RUNNER_TEMP/vendor-history/$repo.git"
            echo "$repo: $(git --git-dir="$RUNNER_TEMP/vendor-history/$repo.git" rev-list --all | wc -l) commits"
          done
          echo "BW_VENDOR_HISTORY_DIR=$RUNNER_TEMP/vendor-history" >> "$GITHUB_ENV"

      # THE PIN-READER TESTS HAVE NEVER RUN IN CI, and that is how a stale
      # inventory shipped. Four tests need a bw-board tree AT THE PIN --
      # bw-board-census, vendor-identity, and the two i8086-bios provenance
      # gates -- and each of them skips BY NAME when BW_BOARD_DIR is unset. The
      # skips were honest and nobody was reading them, so vendor-identity's
      # convergence inventory went stale through a pin bump and was still
      # claiming "APPEARED rp2040-bootrom.js" when the file had converged.
      #
      # No workflow in this repo provided that tree. I checked every file under
      # .github/workflows before adding one rather than assuming the census step
      # had it: there is no census step in CI at all.
      #
      # Blobless and AT THE PIN SHA, following the emu8051-stc precedent above:
      # a clone pinned to an exact sha is the pinned class, and --filter=blob:none
      # fetches only the objects the checkout needs.
      - name: Fetch the pinned bw-board tree for the pin-reader tests
        id: bwboard_tree
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          set -o pipefail
          PIN=$(node -e "const p=require('./vendor-pins.json')['bw-board']; if(!/^[0-9a-f]{40}$/.test(p || '')) process.exit(1); console.log(p)")
          git clone --filter=blob:none --no-checkout \
            https://github.com/CrispStrobe/bw-board.git /tmp/bw-board
          git -C /tmp/bw-board checkout -q "$PIN"
          # The tree must BE the pin, not merely near it -- a checkout that
          # silently landed elsewhere would make every reader below assert
          # against the wrong tree and still look green.
          GOT=$(git -C /tmp/bw-board rev-parse HEAD)
          [ "$GOT" = "$PIN" ] || { echo "::error::bw-board tree is at $GOT, pin is $PIN"; exit 1; }
          echo "BW_BOARD_DIR=/tmp/bw-board" >> "$GITHUB_ENV"
          echo "bw-board at the pin ${PIN:0:9}"

      - name: Verify pinned installed package bytes and upstream notices
        id: package_provenance
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' && steps.bwboard_tree.outcome == 'success' }}
        run: |
          set -euo pipefail
          UI_PIN=$(node -e "const p=require('./vendor-pins.json')['bw-circuit-ui']; if(!/^[0-9a-f]{40}$/.test(p || '')) process.exit(1); console.log(p)")
          git clone --filter=blob:none --no-checkout https://github.com/CrispStrobe/bw-circuit-ui.git /tmp/bw-circuit-ui
          git -C /tmp/bw-circuit-ui checkout --detach -q "$UI_PIN"
          [ "$(git -C /tmp/bw-circuit-ui rev-parse HEAD)" = "$UI_PIN" ]
          node scripts/pin-packages.mjs --verify-installed \
            --source bw-board=/tmp/bw-board --source bw-circuit-ui=/tmp/bw-circuit-ui \
            --installed-root node_modules --installed-root packages/scratch-gui/node_modules
          node scripts/package-upstream-notices.mjs --check

      # The absent-by-design proof consumes BW_BOARD_DIR at the recorded pin.
      # No second moving checkout or skip when the default branch advances.

      # The EXECUTED C side of the P3 differential (plan N11a) compiles generateC's
      # Pico output with arm-none-eabi-gcc. The runner has none, so the sha-pinned
      # ARM GNU toolchain (13.2.rel1) is fetched here — content-pinned in
      # scripts/sync-arm-toolchain.mjs (verified before extract, --version asserted
      # after), declared in test/fetch-pinning.test.mjs. This is the ONLY job that
      # runs that differential (test:fast), so it is fetched only here; the build
      # job is not sharded, so there is no shard clause to add.
      - name: Restore the sha-pinned ARM toolchain from cache
        id: arm_cache
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/arm-toolchain
          # Keyed on the sha256 ALONE (ARM_TOOLCHAIN.sha256): a URL change with no
          # byte change never re-downloads, and new bytes are a new key.
          key: arm-toolchain-6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb

      - name: Fetch the sha-pinned ARM toolchain for the executed-C differential (tolerated absent)
        id: arm_toolchain
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        # Measured: 171 MB cold-downloads ~6 s @ ~30 MB/s from a box (2026-09-07);
        # 8 min is wide margin for a slow-network runner plus xz extraction.
        timeout-minutes: 8
        run: |
          set -o pipefail
          # sync-arm-toolchain.mjs uses a preinstalled arm-none-eabi-gcc if present,
          # else fetches+verifies+extracts the pinned 13.2.rel1 (a cache hit skips
          # the download). Tolerated absent by name: a transient ARM CDN failure
          # makes the executed-C tests SKIP, like the firmware step, never redden.
          if ! node scripts/sync-arm-toolchain.mjs | tee /tmp/arm.out; then
            echo "::warning::ARM toolchain fetch/verify failed — the executed-C differential will skip by name"
            exit 0
          fi
          BIN_DIR=$(grep -oE '^BIN_DIR=.*' /tmp/arm.out | tail -1 | cut -d= -f2)
          if [ -n "$BIN_DIR" ]; then echo "$BIN_DIR" >> "$GITHUB_PATH"; fi

      # The Pico MicroPython firmware (650 KB, sha256-pinned, gitignored) gates
      # TWELVE unit tests — pico-micropython-boot, pico-sim-transport-drain,
      # p3-pin-c-mpy-differential, pico-image-builder, pico-micropython-gpio —
      # and until 2026-09-07 this job never fetched it, so none of the twelve
      # had executed in any of 20 green main runs, while the browser job below
      # fetched the same file for its sim gate (plan T13). Cached by the sha256
      # alone, like the ARM toolchain; tolerated absent BY NAME: on a fetch
      # failure the twelve skip with their reason, and every skip in this job
      # must point at where it executes (check-test-run, LANES.md).
      - name: Restore the sha-pinned Pico MicroPython firmware from cache
        id: pico_cache
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/pico-micropython
          # FIRMWARE.sha256 in scripts/probe-pico-micropython.mjs; new bytes are a new key.
          key: pico-micropython-e92c2a253d2d4830d56cd6aebae1bbc6c913f413122dabba3cc2de74b984bba9
      - name: Fetch the sha-pinned Pico MicroPython firmware for the unit tests (tolerated absent)
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        timeout-minutes: 3
        run: npm run sync:picomicropython || echo "::warning::pico firmware sync failed — the twelve firmware-gated unit tests will skip by name"
      # MakeCode's compiler + simulators (MIT, ~48 MB of sha256-pinned npm tarballs,
      # never committed). Served under static/makecode by the editor build below, and
      # needed by test/makecode-pxt-runtime (which SKIPS BY NAME without it).
      - name: Restore the sha256-pinned MakeCode runtime tarballs from cache
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/makecode
          # The pin tables (TARBALLS, BASES) live in the sync script: a changed pin is a new key.
          key: makecode-${{ hashFiles('scripts/sync-makecode-runtime.mjs') }}
      - name: Fetch the pinned MakeCode runtime (tolerated absent)
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        timeout-minutes: 5
        run: npm run sync:makecode || echo "::warning::MakeCode runtime sync failed — the MakeCode compile tests skip by name and the build will not offer it"

      # THE FPGA PACKER GATE NEEDS A PYTHON RUNTIME, AND IT IS NOT A DEPENDENCY.
      # test/fpga-pyodide-packer.test.mjs asserts that Apicula's gowin_pack,
      # running under Pyodide, packs the committed nextpnr fixtures to bitstreams
      # BYTE-IDENTICAL to the native packer. That is the measurement that
      # reversed docs/TANG-NANO.md §8c ("there is no path"), so it is worth
      # running rather than recording once and trusting.
      #
      # Pyodide is 17 MB and serves exactly this gate, so it is installed into
      # gitignored artifacts/ rather than added to package.json, and Apicula
      # itself comes from PyPI at run time. Tolerated absent for the same reason
      # the Pico firmware is: a network failure must degrade the run to a NAMED
      # skip, not redden a build over something nobody changed.
      - name: Install Pyodide for the FPGA bitstream-packer gate (tolerated absent)
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        timeout-minutes: 4
        run: node scripts/probe-pyodide-packer.mjs --install-only || echo "::warning::pyodide install failed — the two packer gates will skip by name"

      # THE GPL TOOLCHAIN, FETCHED RATHER THAN TRACKED.
      # SDCC is GPL-2.0-or-later and this repository is BSD-3-Clause, so as of
      # 2026-09-08 the binaries are no longer committed here — they live at
      # https://github.com/CrispStrobe/sdcc-wasm and the app downloads them only
      # when a user opts in. Four Node consumers still READ that directory
      # (smoke-debugger, the two wasm-compiler suites, pack-sdcc-runtime), so CI
      # fetches it here.
      #
      # TOLERATED ABSENT, deliberately. A network fetch in a previously hermetic
      # job must not turn a github.io hiccup into a red build on unrelated work:
      # the consumers skip BY NAME when the directory is missing, which is loud
      # in the TAP and cannot be mistaken for a pass.
      - name: Fetch the GPL SDCC toolchain for the Node consumers (tolerated absent)
        id: sdcc_toolchain
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          ORIGIN=https://crispstrobe.github.io/sdcc-wasm/static/sdcc-wasm
          DEST=overlay/scratch-gui/src/lib/sdcc-wasm/dist
          mkdir -p "$DEST/include/mcs51" "$DEST/lib/small"
          ok=1
          for f in cc1.js cc1.wasm sdcc.js sdcc.wasm sdas8051.js sdas8051.wasm \
                   sdld.js sdld.wasm runtime.json; do
            curl -fsS --max-time 120 -o "$DEST/$f" "$ORIGIN/$f" || { ok=0; break; }
          done
          if [ "$ok" = "1" ]; then
            cp -r "$DEST" packages/scratch-gui/src/lib/sdcc-wasm/dist 2>/dev/null || true
            echo "SDCC toolchain fetched from the GPL origin ($(du -sh "$DEST" | cut -f1))"
          else
            echo "::warning::GPL toolchain not fetched — the SDCC Node gates will skip by name"
            rm -rf "$DEST"
            exit 1
          fi

      - name: Resolve the path-scoped stc flasher pin
        id: stc_flasher_pin
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          node -e 'const sha=require("./vendor-pins.json")["stc-compiler-flasher"]; if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error("stc-compiler-flasher must be a full SHA"); process.stdout.write(`sha=${sha}\n`)' >> "$GITHUB_OUTPUT"

      - name: Fetch stc-compiler at the flasher artifact pin
        id: stc_flasher_source
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' && steps.stc_flasher_pin.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/stc-compiler
          ref: ${{ steps.stc_flasher_pin.outputs.sha }}
          path: .stc-compiler-flasher

      - name: Prepare official Ubuntu package mirror
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: sudo env "PATH=$PATH" node scripts/prepare-playwright-apt.mjs

      - name: Install Playwright Chromium for the PXT Arcade oracle in the unit tests
        id: unit_playwright
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        timeout-minutes: 10
        # Run even if another independent guard failed. Unit tests below require
        # this actual installation; they must not run against a missing browser.
        # Bound one installation step; do not start nested retries that may
        # contend with APT children left behind by a timed-out attempt.
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Admit the pinned Arrays source for native unit inputs
        id: arrays_number_value_source
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: node scripts/admit-arrays-number-value-test-source.mjs
      - name: Run unit tests
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' && steps.unit_playwright.outcome == 'success' && steps.stc_flasher_pin.outcome == 'success' && steps.stc_flasher_source.outcome == 'success' && steps.arrays_number_value_source.outcome == 'success' }}
        env:
          # Fixtures create and remove unique children; never fall back to a host temp root.
          TMPDIR: ${{ runner.temp }}
          BW_TEST_SHARD: ${{ matrix.shard }}/8
          BW_ARRAY_MENU_FAILURE_ROOT: ${{ github.workspace }}/test-results
          BW_ARRAY_NUMBER_VALUE_SOURCE: ${{ github.workspace }}/test-results/arrays-number-value-input/arrays.js
          BW_ARRAY_NAMED_JSON_SOURCE: ${{ github.workspace }}/test-results/arrays-number-value-input/arrays.js
          BW_ARRAY_PRIOR_BINDING_SOURCE: ${{ github.workspace }}/test-results/arrays-number-value-input/arrays.js
          STC_COMPILER_FLASHER_DIR: ${{ github.workspace }}/.stc-compiler-flasher
        run: |
          if ! grep -q '"test"' package.json; then
            echo "::error::package.json has no test script — tests exist but nothing runs them"
            exit 1
          fi
          set -o pipefail
          # This shard partitions the complete non-corpus suite; the two corpus
          # walks remain in their existing required job. They run in the `corpus` job below, in parallel with this
          # one, and deployment requires corpus, all six unit shards and the build. `npm test` locally is still all of it.
          mkdir -p test-results
          # The runner's OWN exit status is captured and returned at the end, so
          # the two readings below print on red runs too — the days they matter
          # most — instead of the shell's -e ending the step at the pipeline.
          set +e
          npm run test:fast:shard 2>&1 | tee /tmp/unit.tap
          rc=${PIPESTATUS[0]}
          set -e
          # The GUI-scope resolve hook (scripts/lib/gui-scope-hooks.mjs) is the
          # boundary between root tests and GUI dependencies, and it must stay a
          # MEASURED list: every bare specifier it re-resolved from
          # packages/scratch-gui, by count, so growth is seen rather than hidden.
          echo "bare specifiers re-resolved from packages/scratch-gui by the unit tests:"
          if [ -s test-results/fast.gui-scope.tsv ]; then cut -f1 test-results/fast.gui-scope.tsv | sort | uniq -c | sort -rn; else echo "  (none)"; fi
          # Measured, then DECLARED: every specifier and every test above must be in
          # scripts/lib/gui-scope-allowed.json, or this fails by name. The boundary
          # grows only by review.
          node scripts/check-gui-scope.mjs --log test-results/fast.gui-scope.tsv
          # Did the run report on what it was handed? Every file
          # scripts/list-tests.mjs puts in this set must appear in the per-file
          # census with at least one test, and ordinary failures must be counted by
          # the summary (header of the script). On a red run this still names a
          # file that vanished or failed to construct, beside the real failure.
          node scripts/check-test-run.mjs --set fast --shard "$BW_TEST_SHARD" --tap /tmp/unit.tap --census test-results/fast.census.json --max-stdout-bytes 0
          # A SUITE THAT CANNOT BE CONSTRUCTED CURRENTLY READS AS A SUITE THAT
          # PASSED, and that is not a hypothesis — it happened in run
          # 32779945069 on this branch. `test/wait-census.test.mjs` calls a
          # script that could not resolve its import, so the `describe` body
          # threw while the suite was being built. The runner printed
          #
          #     not ok 662 - the wait census: fixed sleeps are counted…
          #     # tests 1014   # pass 1013   # fail 0
          #
          # and the step went GREEN on the runner's node (22.23.2). The same
          # minimal repro exits 1 on node 20.20.2, so the exit-code half is
          # version-dependent; the miscount is not — `# fail 0` alongside a
          # `not ok` appears on both.
          #
          # A construction failure is the WORST kind to lose: the gate did not
          # run at all, so it cannot have found anything, and a green line says
          # it did. This repo has found five gates that could not fail; this one
          # could not even be built. Classify every depth of the stream; TODO
          # stays pending only with its existing docs pointer checked above.
          node scripts/check-tap-failures.mjs /tmp/unit.tap
          exit "$rc"

      - name: Verify Robot Lab pane interactions in Chromium
        if: ${{ !cancelled() && matrix.shard == 3 && steps.overlays.outcome == 'success' && steps.unit_playwright.outcome == 'success' }}
        timeout-minutes: 3
        env:
          BW_UX_EVIDENCE: ${{ runner.temp }}/robot-lab-pane-ux
        run: node scripts/verify-sim-lab-pane-ux.mjs

      - name: Preserve unit shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-shard-${{ matrix.shard }}
          path: |
            /tmp/unit.tap
            test-results/fast.census.json
            test-results/fast.gui-scope.tsv
            test-results/arrays-number-value-input/
            test-results/menu-failure-*.json
            test-results/menu-capture-failed-*.json
            test-results/typing-failure-*.json
            test-results/typing-capture-failed-*.json
            test-results/effect-failure-*.json
            test-results/effect-capture-failed-*.json
            test-results/paired-door/
          if-no-files-found: error

  build:
    needs: scope
    outputs:
      gui_producer_runner_v1: |
        bw.gui.producer-runner.v1	${{ github.repository }}	${{ github.run_id }}	${{ github.run_attempt }}	build	${{ github.sha }}	${{ github.event.pull_request.head.sha || github.sha }}	${{ github.event.pull_request.head.sha || github.sha }}	${{ github.workflow_sha }}	${{ github.workflow_ref }}
        build_editor	${{ steps['build_editor'].outcome }}	${{ steps['build_editor'].conclusion }}
        gui_build_manifest	${{ steps['gui_build_manifest'].outcome }}	${{ steps['gui_build_manifest'].conclusion }}
        gui_pages_upload	${{ steps['gui_pages_upload'].outcome }}	${{ steps['gui_pages_upload'].conclusion }}
    if: needs.scope.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Require green upstream evidence for the pinned 8086 engine
        # Authenticated: verify-bw-board-ci.mjs reads GH_TOKEN. Without it every runner
        # shares GitHub's anonymous per-IP limit and this step dies with HTTP 403 on a
        # busy night (2026-09-06, twice in one hour), which paints a rate limit and a red
        # bw-board the same colour.
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:bwboard-ci
      - name: Install source-test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Fast, tracked-source verdict before vendor/integrate/install spend. The
      # generated GUI suite below remains the authoritative release verdict.
      - name: Run bounded source-only tests
        run: npm run test:source
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the Code tab (sb3-creator)
        run: node scripts/integrate.mjs
      # Same static asset Vercel deploys, so the browser gate below runs against the
      # shape users get rather than one where the heavy tier is silently missing.
      # Non-fatal on purpose: if the release fetch fails, the engine is simply not
      # offered — lib/labwired-engine.js already answers null instead of throwing,
      # and the gate covers that degraded path too.
      - name: Fetch the heavy simulation engine (labwired-wasm)
        run: node scripts/sync-labwired-wasm.mjs || echo "labwired-wasm unavailable — the heavy tier will not be offered"
      - name: Fetch pinned ESP32-S3 ROM assets
        id: esp32s3_rom_assets
        run: node scripts/sync-esp32s3-roms.mjs || echo "ESP32-S3 ROM assets unavailable — merged-flash boot will report the missing assets"
      - name: Install
        run: |
          set -euo pipefail
          (cd packages/scratch-gui && npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund)
          git diff --exit-code -- packages/scratch-gui/package.json packages/scratch-gui/package-lock.json
      # The deployable build below is flag-ON, and flag-on webpack aliases
      # @yowasp/yosys to the REAL package (an off build gets the yosys-absent stub),
      # so the local FPGA tier's worker resolves. ~75 MB, in the deploy build only.
      - name: Install the local FPGA toolchain (the deployable build is flag-on)
        run: |
          set -euo pipefail
          (cd packages/scratch-gui && npm install --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund @yowasp/yosys)
          git diff --exit-code -- packages/scratch-gui/package.json packages/scratch-gui/package-lock.json
      - name: Apply the scratch-vm overlay (built-in extensions)
        run: node scripts/apply-vm-overlay.mjs
      # The FPGA surface ships in the DEPLOYABLE build (BW_ENABLE_FPGA=1 above),
      # behind a per-user opt-in (Settings ▸ FPGA lab, default off) and lazily
      # loaded so it stays out of first paint — verify-boot-payload proves the
      # heavy libs are not eager. The BROWSER-gate build below stays flag-off, so
      # this parse still guards the flagged JSX for that path — cheap, and it also
      # catches a syntax error before the deploy build reaches it.
      - name: Parse the flagged JSX
        run: node scripts/check-flagged-jsx.mjs
      # Everything from here to `Serve the built app` is an INDEPENDENT check —
      # guards, unit tests, the lazy-bundle inspection, the debugger smoke test.
      # None of them produces an input the next one needs, so none of them should
      # silence the next one. They hang off this id, the last step of the actual
      # prerequisite chain (vendor -> integrate -> install -> overlays).
      - name: Apply the scratch-paint overlay (extended costume designer)
        run: node scripts/apply-paint-overlay.mjs
      # One patch: text costumes wait for the lazy render-fonts chunk (ROADMAP §2.4).
      - name: Apply the scratch-render overlay (lazy render fonts)
        id: overlays
        run: node scripts/apply-render-overlay.mjs

      # --- guards: catch silent reverts before the build runs ---
      #
      # Falsified 2026-08-09 on branch guard-falsification (deleted):
      #   1. stc12 truncated to 4 opcodes → CAUGHT (run 31312830786)
      #      "Bundled stc12 has only 4 opcodes (need ≥10)"
      #   2. PIN=2f896b1a with matching binary → CAUGHT (run 31312945118)
      #      "WASM PIN is not a descendant of the crash-fix floor (85ed23d)"
      #      Proved the floor check, not a single-hash blacklist.
      #   3. blocks.jsx null-guard removed → CAUGHT (run 31313002380)
      #      "blocks.jsx is missing the toolbox null-guard"
      #      Exact replay of the 0ba092b revert that caused the live outage.
      #   4. HOC throw (unknown GUI crash) → CAUGHT (run 31331264070)
      #      "FAIL: GUI did not render" — all 3 static guards passed, only the
      #      headless browser check caught it. Proved it catches unknown causes,
      #      not just the three named regressions. Branch: guard4-falsification.

      - name: Guard — bundled stc12 has all emitted opcodes
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          FILE=overlay/scratch-vm/src/extensions/crispstrobe/stc12/index.js
          # `grep -o | wc -l` counts OCCURRENCES; `grep -c` counts LINES that
          # match. The bundles are one long line now — they hold the extension
          # as a JSON string rather than a template literal, because a stray
          # backtick in a comment closed the template early twice (711e4744f,
          # 2258847c1). With `grep -c` this guard read 30 opcodes as 1 and
          # failed a correct tree.
          COUNT=$(grep -o 'opcode:' "$FILE" | wc -l | tr -d ' ')
          echo "stc12 opcodes: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::Bundled stc12 has only $COUNT opcodes (need ≥10). Was it rebuilt from the gallery?"
            exit 1
          fi

      - name: Guard — WASM pin is a descendant of the crash-fix floor
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          # The floor: 85ed23d94a1fbf8a15c2ddff068d438a832913cc is the commit
          # with the emu_init crash fix and corrected BUILD-INFO.md. Any pin
          # older than this ships a crashing binary. Bump the floor when a
          # newer build is deliberately adopted.
          #
          # Full 40-hex, like the PIN it is compared against: an abbreviation is
          # unique only within one repo at one moment, and `--is-ancestor` given
          # an ambiguous or unknown rev fails in a way this step reads as "not a
          # descendant" — a true-looking error about the wrong thing.
          FLOOR=85ed23d94a1fbf8a15c2ddff068d438a832913cc
          PIN=$(node -e "
            const src = require('fs').readFileSync('scripts/sync-emu8051-wasm.mjs','utf8');
            const m = src.match(/const PIN = '([^']+)'/);
            console.log(m ? m[1] : '');
          ")
          echo "PIN=$PIN  FLOOR=$FLOOR"
          if [ -z "$PIN" ]; then
            echo "::error::Could not extract PIN from sync-emu8051-wasm.mjs"
            exit 1
          fi
          # Clone just enough of emu8051-stc to check ancestry
          git clone --bare --filter=blob:none https://github.com/CrispStrobe/emu8051-stc.git /tmp/emu8051-stc.git 2>/dev/null
          if ! git -C /tmp/emu8051-stc.git merge-base --is-ancestor "$FLOOR" "$PIN" 2>/dev/null; then
            echo "::error::WASM PIN ($PIN) is not a descendant of the crash-fix floor ($FLOOR). Re-pin to $FLOOR or later."
            exit 1
          fi
          echo "PIN is at or after the floor — good"
          node scripts/sync-emu8051-wasm.mjs --check

      - name: Guard — blocks.jsx has the toolbox null-guard
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          # The crash: blocks.jsx passes this.props.toolboxXML to ScratchBlocks.inject().
          # toolboxXML is null at startup (deferred because scratch-blocks is lazy-loaded).
          # Without the null-guard, inject() gets null and the GUI doesn't mount.
          FILE=overlay/scratch-gui/src/containers/blocks.jsx
          if ! grep -q 'this.props.toolboxXML || makeToolboxXML' "$FILE"; then
            echo "::error::blocks.jsx is missing the toolbox null-guard (this.props.toolboxXML || makeToolboxXML). GUI will not render."
            exit 1
          fi
          echo "blocks.jsx: toolbox null-guard present (good)"

      # --- tests ---

      - name: Gate — independent SPIKE runtime with retired firmware assets absent
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        env:
          BW_SPIKE_RECEIPT_DIR: ${{ runner.temp }}/spike-runtime-receipts
        run: node scripts/verify-independent-spike.mjs

      # Milestone 0: the shipped example corpus must be proven to EXECUTE, and
      # the gate that proves it must be present and must still be able to fail.
      # `npm test` below runs both gates through its glob; this step exists so a
      # deleted gate, or a ratchet quietly padded until nothing is red any more,
      # is a build failure and not an absence nobody notices. Both failure modes
      # have happened in this repo: five gates were found that could not fail,
      # and a dead-module exclusion list grew from five entries to sixteen while
      # staying green.
      #
      # Mutation-proven 2026-08-23 (docs/EXAMPLE-CORPUS-FINDINGS.md, seven
      # mutations): breaking a shipped example, deleting an opcode from a
      # bundled extension, padding a ratchet, and removing the corpus each make
      # the gate red.
      - name: Guard — the example execution gates exist and their ratchets have not grown
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          set -e
          for gate in test/example-vm-execution.test.mjs test/example-execution.test.mjs; do
            if [ ! -f "$gate" ]; then
              echo "::error::$gate is missing — the shipped example corpus would be unproven"
              exit 1
            fi
          done
          # A waiver list may only shrink. Lower these as examples are fixed,
          # never raise them. All four example waivers are now ZERO, so these
          # ceilings are zero: any reappearance is a regression, not a budget to
          # spend. KNOWN_INERT 4 -> 0 and KNOWN_MISSING_OPCODES -> 0 when the
          # eleven devices_oled*/devices_tft* opcodes were defined (37 -> 48
          # blocks); KNOWN_SHADOWED_WRITES 19 -> 0 and KNOWN_NO_BLOCKS 2 -> 0 with
          # the sb3-creator pin bump to 1a83dfa. TIME_GATED is NOT a waiver list
          # -- its entries still carry a static assertion -- but it is capped too,
          # so it cannot quietly become one.
          node -e "
            const fs = require('fs');
            // Strip line comments before counting. The counter looks for quoted
            // strings, and a stray apostrophe in prose reads as a quoted span —
            // it reported an entry in a list with none. A guard that miscounts is
            // worse than no guard, so it does not get to read prose.
            const gate = fs.readFileSync('test/example-vm-execution.test.mjs', 'utf8')
              .split('\n').map(l => l.replace(/^\s*\/\/.*$/, '')).join('\n');
            // A Set entry is 'id'; a Map entry is ['id', 'reason'] and would
            // otherwise count double. Count the id, whichever shape it is in.
            const count = (name) => {
              const at = gate.indexOf(name);
              if (at < 0) { console.error('::error::' + name + ' is gone from the gate'); process.exit(1); }
              const isMap = /new Map\(/.test(gate.slice(at, at + 40));
              const body = gate.slice(gate.indexOf('[', at), gate.indexOf(isMap ? '])' : ']', at));
              return (body.match(isMap ? /\['[^']+'/g : /'[^']+'/g) || []).length;
            };
            const ceilings = {KNOWN_INERT: 0, KNOWN_SHADOWED_WRITES: 0, KNOWN_NO_BLOCKS: 0, TIME_GATED: 2};
            let bad = 0;
            for (const [name, ceiling] of Object.entries(ceilings)) {
              const n = count(name);
              console.log(name + ': ' + n + ' waived (ceiling ' + ceiling + ')');
              if (n > ceiling) {
                console.error('::error::' + name + ' grew to ' + n + ' entries (ceiling ' + ceiling +
                  '). A waiver list may only shrink.');
                bad++;
              }
            }
            const undefinedOpcodes = (gate.slice(gate.indexOf('KNOWN_MISSING_OPCODES'),
              gate.indexOf('KNOWN_INERT')).match(/'[a-z0-9]+_[a-z0-9_]+'/g) || []).length;
            console.log('KNOWN_MISSING_OPCODES: ' + undefinedOpcodes + ' opcodes waived (ceiling 0)');
            if (undefinedOpcodes > 0) {
              console.error('::error::KNOWN_MISSING_OPCODES grew to ' + undefinedOpcodes + ' opcodes.');
              bad++;
            }
            process.exit(bad ? 1 : 0);
          "

      - name: Guard — the fetch-pinning gate exists and can still fail
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          set -e
          # `npm test` below runs test/fetch-pinning.test.mjs through its glob.
          # This step exists for the two failure modes a green suite cannot
          # distinguish from a passing gate: the gate DELETED, and the gate
          # unable to go red. Both have happened in this repo — five gates were
          # found that could not fail, and one of them walked a tree containing
          # its own prover, so every string-literal target matched itself.
          #
          # The prover mutates tracked files and reverts each in a finally
          # block; it exits 2 if the tree does not come back green, so a failed
          # revert cannot be mistaken for a passing run.
          if [ ! -f test/fetch-pinning.test.mjs ]; then
            echo "::error::test/fetch-pinning.test.mjs is missing — every fetch in this repo would be unchecked"
            exit 1
          fi
          # No `git diff` here. By this point `npm install`, vendor and integrate
          # have modified thousands of tracked files, so a dirty tree says
          # nothing about the prover — and the first version of this step
          # reported "the pinning prover left the tree dirty" after the prover
          # had just printed 11/11 caught (run 32762117022). A well-formed,
          # confident statement about the wrong thing, in the step meant to
          # catch exactly that. The prover checks its own restoration at BYTE
          # level against what each file held before it touched it, which is
          # the question, and exits 2 if a revert failed.
          node scripts/prove-fetch-pinning.mjs

      # Three checks that read example JSON off disk — no browser, no server,
      # no built app. They were sitting unrun with the browser gates purely
      # because of their filename, and they cost about a second each.
      - name: Content gates — faceplates, hub faces, retro console
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          node scripts/verify-faceplate-blinkenrocket.mjs
          node scripts/verify-lego-hub-faces.mjs
          node scripts/verify-retro-console.mjs

      # test/pin-move-chain.test.mjs (plan T9) needs two histories the default
      # checkout does not have: this repo's own, for every value vendor-pins.json
      # ever held (depth-1 sees one commit and the half would pass on an empty
      # set — the test refuses that by name), and the vendored repos', so a sha of
      # theirs that was never a pin is caught too. Both without blobs: the
      # unshallow measured 3.2 s on a CI-shaped clone, each bare clone ~1 s.
      - name: Vendored-repo history for the pin-move gate
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --quiet --unshallow --filter=blob:none origin
          fi
          echo "vendor-pins.json history: $(git rev-list --count HEAD -- vendor-pins.json) commits"
          mkdir -p "$RUNNER_TEMP/vendor-history"
          for repo in bw-board sb3-creator bw-circuit-ui; do
            git clone --quiet --bare --filter=blob:none "https://github.com/CrispStrobe/$repo.git" "$RUNNER_TEMP/vendor-history/$repo.git"
            echo "$repo: $(git --git-dir="$RUNNER_TEMP/vendor-history/$repo.git" rev-list --all | wc -l) commits"
          done
          echo "BW_VENDOR_HISTORY_DIR=$RUNNER_TEMP/vendor-history" >> "$GITHUB_ENV"

      # THE PIN-READER TESTS HAVE NEVER RUN IN CI, and that is how a stale
      # inventory shipped. Four tests need a bw-board tree AT THE PIN --
      # bw-board-census, vendor-identity, and the two i8086-bios provenance
      # gates -- and each of them skips BY NAME when BW_BOARD_DIR is unset. The
      # skips were honest and nobody was reading them, so vendor-identity's
      # convergence inventory went stale through a pin bump and was still
      # claiming "APPEARED rp2040-bootrom.js" when the file had converged.
      #
      # No workflow in this repo provided that tree. I checked every file under
      # .github/workflows before adding one rather than assuming the census step
      # had it: there is no census step in CI at all.
      #
      # Blobless and AT THE PIN SHA, following the emu8051-stc precedent above:
      # a clone pinned to an exact sha is the pinned class, and --filter=blob:none
      # fetches only the objects the checkout needs.
      - name: Fetch the pinned bw-board tree for the pin-reader tests
        id: bwboard_tree
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          set -o pipefail
          PIN=$(node -e "const p=require('./vendor-pins.json')['bw-board']; if(!/^[0-9a-f]{40}$/.test(p || '')) process.exit(1); console.log(p)")
          git clone --filter=blob:none --no-checkout \
            https://github.com/CrispStrobe/bw-board.git /tmp/bw-board
          git -C /tmp/bw-board checkout -q "$PIN"
          # The tree must BE the pin, not merely near it -- a checkout that
          # silently landed elsewhere would make every reader below assert
          # against the wrong tree and still look green.
          GOT=$(git -C /tmp/bw-board rev-parse HEAD)
          [ "$GOT" = "$PIN" ] || { echo "::error::bw-board tree is at $GOT, pin is $PIN"; exit 1; }
          echo "BW_BOARD_DIR=/tmp/bw-board" >> "$GITHUB_ENV"
          echo "bw-board at the pin ${PIN:0:9}"

      - name: Verify pinned installed package bytes and upstream notices
        id: package_provenance
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' && steps.bwboard_tree.outcome == 'success' }}
        run: |
          set -euo pipefail
          UI_PIN=$(node -e "const p=require('./vendor-pins.json')['bw-circuit-ui']; if(!/^[0-9a-f]{40}$/.test(p || '')) process.exit(1); console.log(p)")
          git clone --filter=blob:none --no-checkout https://github.com/CrispStrobe/bw-circuit-ui.git /tmp/bw-circuit-ui
          git -C /tmp/bw-circuit-ui checkout --detach -q "$UI_PIN"
          [ "$(git -C /tmp/bw-circuit-ui rev-parse HEAD)" = "$UI_PIN" ]
          node scripts/pin-packages.mjs --verify-installed \
            --source bw-board=/tmp/bw-board --source bw-circuit-ui=/tmp/bw-circuit-ui \
            --installed-root node_modules --installed-root packages/scratch-gui/node_modules
          node scripts/package-upstream-notices.mjs --check

      # The absent-by-design proof consumes BW_BOARD_DIR at the recorded pin.
      # No second moving checkout or skip when the default branch advances.

      # The EXECUTED C side of the P3 differential (plan N11a) compiles generateC's
      # Pico output with arm-none-eabi-gcc. The runner has none, so the sha-pinned
      # ARM GNU toolchain (13.2.rel1) is fetched here — content-pinned in
      # scripts/sync-arm-toolchain.mjs (verified before extract, --version asserted
      # after), declared in test/fetch-pinning.test.mjs. This is the ONLY job that
      # runs that differential (test:fast), so it is fetched only here; the build
      # job is not sharded, so there is no shard clause to add.
      - name: Restore the sha-pinned ARM toolchain from cache
        id: arm_cache
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/arm-toolchain
          # Keyed on the sha256 ALONE (ARM_TOOLCHAIN.sha256): a URL change with no
          # byte change never re-downloads, and new bytes are a new key.
          key: arm-toolchain-6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb

      - name: Fetch the sha-pinned ARM toolchain for the executed-C differential (tolerated absent)
        id: arm_toolchain
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        # Measured: 171 MB cold-downloads ~6 s @ ~30 MB/s from a box (2026-09-07);
        # 8 min is wide margin for a slow-network runner plus xz extraction.
        timeout-minutes: 8
        run: |
          set -o pipefail
          # sync-arm-toolchain.mjs uses a preinstalled arm-none-eabi-gcc if present,
          # else fetches+verifies+extracts the pinned 13.2.rel1 (a cache hit skips
          # the download). Tolerated absent by name: a transient ARM CDN failure
          # makes the executed-C tests SKIP, like the firmware step, never redden.
          if ! node scripts/sync-arm-toolchain.mjs | tee /tmp/arm.out; then
            echo "::warning::ARM toolchain fetch/verify failed — the executed-C differential will skip by name"
            exit 0
          fi
          BIN_DIR=$(grep -oE '^BIN_DIR=.*' /tmp/arm.out | tail -1 | cut -d= -f2)
          if [ -n "$BIN_DIR" ]; then echo "$BIN_DIR" >> "$GITHUB_PATH"; fi

      # The Pico MicroPython firmware (650 KB, sha256-pinned, gitignored) gates
      # TWELVE unit tests — pico-micropython-boot, pico-sim-transport-drain,
      # p3-pin-c-mpy-differential, pico-image-builder, pico-micropython-gpio —
      # and until 2026-09-07 this job never fetched it, so none of the twelve
      # had executed in any of 20 green main runs, while the browser job below
      # fetched the same file for its sim gate (plan T13). Cached by the sha256
      # alone, like the ARM toolchain; tolerated absent BY NAME: on a fetch
      # failure the twelve skip with their reason, and every skip in this job
      # must point at where it executes (check-test-run, LANES.md).
      - name: Restore the sha-pinned Pico MicroPython firmware from cache
        id: pico_cache
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/pico-micropython
          # FIRMWARE.sha256 in scripts/probe-pico-micropython.mjs; new bytes are a new key.
          key: pico-micropython-e92c2a253d2d4830d56cd6aebae1bbc6c913f413122dabba3cc2de74b984bba9
      - name: Fetch the sha-pinned Pico MicroPython firmware for the unit tests (tolerated absent)
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        timeout-minutes: 3
        run: npm run sync:picomicropython || echo "::warning::pico firmware sync failed — the twelve firmware-gated unit tests will skip by name"
      # MakeCode's compiler + simulators (MIT, ~48 MB of sha256-pinned npm tarballs,
      # never committed). Served under static/makecode by the editor build below, and
      # needed by test/makecode-pxt-runtime (which SKIPS BY NAME without it).
      - name: Restore the sha256-pinned MakeCode runtime tarballs from cache
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/makecode
          # The pin tables (TARBALLS, BASES) live in the sync script: a changed pin is a new key.
          key: makecode-${{ hashFiles('scripts/sync-makecode-runtime.mjs') }}
      - name: Fetch the pinned MakeCode runtime (tolerated absent)
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        timeout-minutes: 5
        run: npm run sync:makecode || echo "::warning::MakeCode runtime sync failed — the MakeCode compile tests skip by name and the build will not offer it"

      # THE FPGA PACKER GATE NEEDS A PYTHON RUNTIME, AND IT IS NOT A DEPENDENCY.
      # test/fpga-pyodide-packer.test.mjs asserts that Apicula's gowin_pack,
      # running under Pyodide, packs the committed nextpnr fixtures to bitstreams
      # BYTE-IDENTICAL to the native packer. That is the measurement that
      # reversed docs/TANG-NANO.md §8c ("there is no path"), so it is worth
      # running rather than recording once and trusting.
      #
      # Pyodide is 17 MB and serves exactly this gate, so it is installed into
      # gitignored artifacts/ rather than added to package.json, and Apicula
      # itself comes from PyPI at run time. Tolerated absent for the same reason
      # the Pico firmware is: a network failure must degrade the run to a NAMED
      # skip, not redden a build over something nobody changed.
      - name: Install Pyodide for the FPGA bitstream-packer gate (tolerated absent)
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        timeout-minutes: 4
        run: node scripts/probe-pyodide-packer.mjs --install-only || echo "::warning::pyodide install failed — the two packer gates will skip by name"

      # THE GPL TOOLCHAIN, FETCHED RATHER THAN TRACKED.
      # SDCC is GPL-2.0-or-later and this repository is BSD-3-Clause, so as of
      # 2026-09-08 the binaries are no longer committed here — they live at
      # https://github.com/CrispStrobe/sdcc-wasm and the app downloads them only
      # when a user opts in. Four Node consumers still READ that directory
      # (smoke-debugger, the two wasm-compiler suites, pack-sdcc-runtime), so CI
      # fetches it here.
      #
      # TOLERATED ABSENT, deliberately. A network fetch in a previously hermetic
      # job must not turn a github.io hiccup into a red build on unrelated work:
      # the consumers skip BY NAME when the directory is missing, which is loud
      # in the TAP and cannot be mistaken for a pass.
      - name: Fetch the GPL SDCC toolchain for the Node consumers (tolerated absent)
        id: sdcc_toolchain
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          ORIGIN=https://crispstrobe.github.io/sdcc-wasm/static/sdcc-wasm
          DEST=overlay/scratch-gui/src/lib/sdcc-wasm/dist
          mkdir -p "$DEST/include/mcs51" "$DEST/lib/small"
          ok=1
          for f in cc1.js cc1.wasm sdcc.js sdcc.wasm sdas8051.js sdas8051.wasm \
                   sdld.js sdld.wasm runtime.json; do
            curl -fsS --max-time 120 -o "$DEST/$f" "$ORIGIN/$f" || { ok=0; break; }
          done
          if [ "$ok" = "1" ]; then
            cp -r "$DEST" packages/scratch-gui/src/lib/sdcc-wasm/dist 2>/dev/null || true
            echo "SDCC toolchain fetched from the GPL origin ($(du -sh "$DEST" | cut -f1))"
          else
            echo "::warning::GPL toolchain not fetched — the SDCC Node gates will skip by name"
            rm -rf "$DEST"
            exit 1
          fi

      - name: Resolve the path-scoped stc flasher pin
        id: stc_flasher_pin
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: |
          node -e 'const sha=require("./vendor-pins.json")["stc-compiler-flasher"]; if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error("stc-compiler-flasher must be a full SHA"); process.stdout.write(`sha=${sha}\n`)' >> "$GITHUB_OUTPUT"

      - name: Fetch stc-compiler at the flasher artifact pin
        id: stc_flasher_source
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' && steps.stc_flasher_pin.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/stc-compiler
          ref: ${{ steps.stc_flasher_pin.outputs.sha }}
          path: .stc-compiler-flasher

      - name: Prepare official Ubuntu package mirror
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: sudo env "PATH=$PATH" node scripts/prepare-playwright-apt.mjs

      - name: Install Playwright Chromium for the PXT Arcade oracle in the unit tests
        id: unit_playwright
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        timeout-minutes: 10
        # Run even if another independent guard failed. Unit tests below require
        # this actual installation; they must not run against a missing browser.
        # Bound one installation step; do not start nested retries that may
        # contend with APT children left behind by a timed-out attempt.
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # A green suite says every assertion PASSED. It does not say any of them could have
      # failed. These mutations weaken a real enforcement point and require the named suite to
      # go red — the proofs existed before this step, by hand, in commit messages, which means
      # they decayed silently the moment anyone edited a guard. Seven seconds.
      #
      # It restores every file in a `finally`, and a mutation whose anchor no longer occurs
      # exactly once is a FAILURE rather than a skip: a rotted mutation proves nothing while
      # continuing to look like a proof.
      - name: Mutation proofs — every enforcement layer must be able to fail
        run: node scripts/mutation-proof.mjs

      # --- build ---

      - name: Guard — packaged native broker proof authority is fresh
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: node scripts/package-native-broker-proof-pins.mjs --check

      - name: Guard — packaged native broker host and worker assets are fresh
        run: node scripts/package-native-broker-assets.mjs --check

      - name: Build the editor
        id: build_editor
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' && steps.package_provenance.outcome == 'success' }}
        run: cd packages/scratch-gui && NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 BW_ENABLE_CAD=1 BW_ENABLE_FPGA=1 BW_SYNTHESIS_ENDPOINT=https://synth.crispstro.be/api npm run build

      # Keep this focused check in the ordinary PR build: the larger browser
      # matrix requires ci:full and does not qualify the Logikus workbench.
      - name: Verify Logikus browser behavior
        id: logikus_browser
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/verify-logikus-browser.mjs
      - name: Retain Logikus browser report and screenshots
        if: ${{ !cancelled() && (steps.logikus_browser.outcome == 'success' || steps.logikus_browser.outcome == 'failure') }}
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logikus-browser-evidence
          path: artifacts/logikus-browser/
          if-no-files-found: error
          retention-days: 7

      - name: Guard — emitted native broker proof bytes retain reviewed authority
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        run: |
          node scripts/verify-emitted-native-broker-proof.mjs packages/scratch-gui/build
          node scripts/package-upstream-notices.mjs --check --build-dir packages/scratch-gui/build
          node scripts/verify-built-cad-sdk.mjs packages/scratch-gui/build
          node scripts/verify-built-cad-robot-projects.mjs packages/scratch-gui/build

      - name: Verify shipped CAD worker telemetry
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/verify-cad-telemetry.mjs

      - name: Guard — emitted distribution policy is the requested policy
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        env:
          BW_EXPECT_REMOTE_CODE_POLICY: allow
        run: node scripts/verify-build-policy.mjs packages/scratch-gui/build

      # LICENCE COMPLIANCE, and the gate that did not exist on 2026-08-10.
      # SDCC is GPL-2.0-or-later; this app is BSD-3-Clause, and tauri.conf.json
      # bundles packages/scratch-gui/build wholesale, so a webpack copy rule put
      # 101 GPL files (8.7 MB) inside the shipping Mac build for four weeks with
      # nothing looking. Like the lazy-loading guard below this asks about a REAL
      # build, so it cannot be a unit test: `npm test` runs before the build.
      - name: Guard — no GPL payload reaches the build output
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        run: node scripts/verify-no-gpl-in-build.mjs packages/scratch-gui/build

      # Peer sessions (task E11, docs/PEERS-SECURITY-REVIEW.md) are a build-time opt-in,
      # BW_ENABLE_PEERS=1, which this build does not set. Like the GPL guard this asks about the
      # REAL emitted bytes: no peer marker in any file, and the scan must see the editor bundle.
      - name: Guard — the default build carries no peer-session code
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        run: node scripts/verify-no-peer-surface.mjs packages/scratch-gui/build

      # The heavy tier is 20 MB and MUST stay out of the first load. That is a
      # question about a real build, so it cannot be a unit test — `npm test`
      # above runs before the build and would skip on every CI run. Two
      # one-character edits (a lost `webpackChunkName`, a dynamic import turned
      # static) put the loader in the entry bundle with nothing else noticing:
      # the app still works, every suite still passes, the engine still runs.
      # Deliberately NOT gated on the artifact fetch above — this inspects
      # bundle contents, which exist whether or not the release download did.
      - name: Guard — the labwired engine stays lazily loaded
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: node scripts/verify-labwired-lazy-bundle.mjs

      # Same question for everything the 2026-09-05 campaign moved OUT of the
      # first load — music samples, render fonts, LEGO hub drivers, the asset
      # library manifests, the lesson waves — and for the text-encoding polyfill
      # that was aliased away. Each is one edit from quietly coming back, and the
      # app works identically either way, so only a look at the built bytes can
      # tell. Header of scripts/verify-boot-payload.mjs has the measurements.
      - name: Guard — the first load stays lean
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        run: node scripts/verify-boot-payload.mjs

      # The debugger smoke compares lite's own emitter against an INDEPENDENT
      # disassembler, which lives in another repo. Fetching it is what turns
      # this step from a permanent skip into a verdict — see below.
      - name: Fetch stc-compiler (the debugger smoke's disassembly oracle)
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CrispStrobe/stc-compiler
          ref: 79df4b6d37c78e463f5c1d8caa3cfaa7712935ad
          path: .stc-compiler

      - name: Smoke-test the debugger
        if: ${{ !cancelled() && steps.overlays.outcome == 'success' }}
        env:
          STC_COMPILER: ${{ github.workspace }}/.stc-compiler
        run: |
          if ! grep -q '"smoke:debugger"' package.json; then
            echo "::error::package.json has no smoke:debugger script — the debugger is untested"
            exit 1
          fi
          # Exit 2 means "a prerequisite is missing", and it USED to be
          # downgraded to a warning here. Because the runner had no compiler,
          # that downgrade ran on every build for months: the step was green,
          # the debugger was never exercised, and three real defects sat behind
          # it (D-SMOKE1, then D-EMU-BP2 and D-EMU-BP3 once it could run).
          #
          # CI now supplies everything the script needs. The 8051 toolchain is
          # in-tree WASM and runs under Node, native sdcc is NOT required
          # (measured: the script exits 0 with sdcc absent from PATH), and the
          # disassembly oracle is checked out above. So exit 2 no longer means
          # "a tool this runner cannot provide" — it means the workflow is
          # broken, and it fails.
          # No `||` branch on purpose: this step no longer swallows anything,
          # and the script's own stderr names any missing prerequisite.
          npm run smoke:debugger
      # `!cancelled()` because the built app is the primary DIAGNOSTIC, and the
      # runs you most want to inspect are the ones that failed. Without it this
      # step carries an implicit success() and is skipped after any red gate, so
      # a failing run uploads proof artifacts for the gates that passed and NOT
      # the app they were driving. Measured on PR #105: two gates failed, no
      # github-pages artifact, and the only way to reproduce locally was to fix
      # the tree and run CI again — a full queue cycle to learn what one download
      # would have shown. Deploying is unaffected: the `deploy` job needs `build`
      # to have succeeded, so an artifact from a red run can be downloaded and
      # never published.
      - name: Write GUI build source manifest
        id: gui_build_manifest
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        env:
          BW_GUI_GIT_EXECUTABLE: /usr/bin/git
          BW_GUI_REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/write-gui-build-manifest.mjs packages/scratch-gui/build
      - name: Stage Brickwright Pages compatibility routes
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' && github.repository_id == '1291854269' }}
        run: node scripts/stage-brickwright-pages-compatibility.mjs packages/scratch-gui/build
      - name: Upload GUI Pages artifact
        id: gui_pages_upload
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        with: { path: packages/scratch-gui/build }

  # THE MISMATCHED-TREE HAZARD, and why parallel builds are safe here when a
  # previous attempt at this fix took the site down.
  #
  # That attempt was a per-JOB split. Artifact names are unique within a RUN, not
  # across runs: two jobs of one run writing `github-pages`, or a deploy job
  # resolving that name while a sibling was still uploading, publishes an
  # index.html from one tree beside chunks from another — which is exactly what
  # went out (index.html naming 404 chunks). Separate RUNS cannot do this to each
  # other; each run's artifact is scoped to its own GITHUB_RUN_ID and
  # `deploy-pages` resolves it there.
  #
  # So the invariant is structural, and `test/pages-deploy-ordering.test.mjs`
  # asserts it rather than leaving it as a comment: BUILD AND UPLOAD STAY IN ONE
  # JOB, and this job takes the artifact from its own run and never fetches one
  # by name. Making the build groups per-commit does not touch that.
  # The two lesson-corpus walks — lesson-numeric-contract and
  # lesson-defect-detector — solve every bench in the catalog and were 278 s of
  # the build job's critical path, ahead of the build and 30 browser gates that
  # cannot start until they finish. Nothing downstream needs their output, so
  # they run here, alongside. Their inputs are overlay/, scripts/ and test/ —
  # they import from the overlay tree directly and need neither the vendored
  # packages nor node_modules (checked 2026-09-05 by running them from a copy
  # with only those three directories). A red here blocks the deploy exactly as
  # it did when it was a step of `build`.
  #
  # Same TAP reading as the unit-test step, for the same reason: a suite that
  # threw while being constructed prints `not ok` and a summary that does not
  # count it.


  # SPLIT 2026-09-05: the browser gates are their own job.
  #
  # The build job was killed by its own `timeout-minutes: 30`, which GitHub
  # reports as CANCELLED rather than failure -- five sessions spent a day
  # hunting an external canceller because of that word. Unsplit: 17.1 min over
  # 97 steps, browser phase 11.5 (67%). Split and measured: build 5m18s,
  # browser 13m23s, parallel, neither cancelled.
  #
  # THIS JOB'S `timeout-minutes: 30` BOUNDS THE 41 GATE STEPS, and lego-b9's
  # per-step timeouts bound each one beneath it. The browser half is the one
  # that grows, so its headroom is the number to watch.
  #
  # BOUNDARIES ARE CONTENT ANCHORS, and the rebuild ASSERTS them -- including
  # that this block's `steps:` is the only one. Two earlier attempts produced
  # a file that parsed and was wrong: line numbers read from a stale revision
  # severed an `upload-artifact` step, and a slice that began one line early
  # gave the job TWO `steps:` keys, which PyYAML silently accepts and Actions
  # rejects with a run that has no jobs at all.
  browser:
    needs: [guard, scope]
    if: needs.guard.outputs.superseded != 'true' && needs.scope.outputs.thorough == 'true' && needs.scope.outputs.browser == 'true'
    # TWO SHARDS OF ONE BODY. The gates below took 13–15 min in series (two
    # dispatch runs, 2026-09-06: labwired heavy tier 140 s, 8086 benchmark 107 s,
    # no-engine-artifact 46 s, AVR offline bench 34 s, debugger recording 30 s,
    # then ~250 s of everything else) while build took 5.5 and corpus 2.2, so
    # the run's verdict waited on this job by ~8 min. Each shard installs,
    # builds and serves for itself (~120 s of runner time, not wall time) and
    # runs the gates whose `if:` names it: `matrix.shard == 'heavy'` on the five
    # long ones, `'light'` on the rest. THAT CLAUSE IS THE SHARD LIST — there is
    # no second list to keep in agreement; test/browser-gate-shards.test.mjs and
    # the audit step both parse these lines and fail by name on a gate with no
    # clause (would run in every shard, and upload-artifact v4 refuses the second
    # artifact of a name), two clauses, a clause naming a shard the matrix lacks
    # (would never run, and stay green), an empty shard, or a companion step
    # (upload, follow-up) whose clause differs from its gate's.
    #
    # fail-fast is OFF on purpose: the shards are independent, and a red heavy
    # cancelling light would (a) report light as `cancelled` — the very signal
    # this fleet misread for a day when the job was hitting its own ceiling —
    # and (b) leave light's gates neither run nor cleanly skipped for the audit.
    # The Measure step (workflow_dispatch only, ~90 s) is on light; on a manual
    # run that is instrumentation, not a regression in the light shard's time.
    name: browser (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [heavy, light, lightcad1, lightcad2, lightcad3, lightartwork, robotlab, robotdraw, robotlink, robotmotion, robotbench, robotlink2, robotbench2, robotdraw2, robotdraw3, robotmotion2, robotaddon1, robotaddon2, robotaddon3, robotaddon4, robotaddon5, robotaddon6, robotaddon7, robotaddon8, robotaddon9, robotaddon10, robotaddon11, robotaddon12, robotaddon13, robotaddon14, robotaddon15, robotaddon16, robotaddon18, robotaddon19, robotaddon22, robotaddon24, robotview]
        # Path-aware PR runs (scripts/ci-browser-scope.mjs): a shard the changed
        # files do not reach is left out. Non-PR events set every shard true.
        exclude:
          - shard: ${{ needs.scope.outputs.heavy != 'true' && 'heavy' || 'none' }}
          - shard: ${{ needs.scope.outputs.light != 'true' && 'light' || 'none' }}
          - shard: ${{ needs.scope.outputs.light != 'true' && 'lightcad1' || 'none' }}
          - shard: ${{ needs.scope.outputs.light != 'true' && 'lightcad2' || 'none' }}
          - shard: ${{ needs.scope.outputs.light != 'true' && 'lightcad3' || 'none' }}
          - shard: ${{ needs.scope.outputs.light != 'true' && 'lightartwork' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotlab' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotdraw' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotlink' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotmotion' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotbench' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotlink2' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotbench2' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotdraw2' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotdraw3' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotmotion2' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon1' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon2' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon3' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon4' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon5' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon6' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon7' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon8' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon9' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon10' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon11' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon12' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon13' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon14' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon15' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon16' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon18' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon19' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon22' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotaddon24' || 'none' }}
          - shard: ${{ needs.scope.outputs.robotlab != 'true' && 'robotview' || 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level permissions REPLACE the workflow's for this job, so the two it
    # needs are both named: contents to check out, actions so the last step can
    # read this run's own steps (scripts/audit-job-steps.mjs). Scoped here rather
    # than workflow-wide so the wider token reaches only the job that audits;
    # read-only either way — the step never cancels, reruns or writes.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: bw_browser_audit_0001
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        id: bw_browser_audit_0002
        with: { node-version: 22 }
      - name: Require green upstream evidence for the pinned 8086 engine
        id: bw_browser_audit_0003
        # Authenticated: verify-bw-board-ci.mjs reads GH_TOKEN. Without it every runner
        # shares GitHub's anonymous per-IP limit and this step dies with HTTP 403 on a
        # busy night (2026-09-06, twice in one hour), which paints a rate limit and a red
