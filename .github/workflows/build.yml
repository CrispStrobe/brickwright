      - name: Verify pinned installed package bytes and upstream notices before browser build
        id: browser_package_provenance
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' }}
        run: |
          set -euo pipefail
          for PACKAGE in bw-board bw-circuit-ui; do
            PACKAGE_PIN=$(node -e "const p=require('./vendor-pins.json')[process.argv[1]]; if(!/^[0-9a-f]{40}$/.test(p || '')) process.exit(1); console.log(p)" "$PACKAGE")
            git clone --filter=blob:none --no-checkout "https://github.com/CrispStrobe/$PACKAGE.git" "/tmp/$PACKAGE"
            git -C "/tmp/$PACKAGE" checkout --detach -q "$PACKAGE_PIN"
            [ "$(git -C "/tmp/$PACKAGE" rev-parse HEAD)" = "$PACKAGE_PIN" ]
          done
          node scripts/pin-packages.mjs --verify-installed \
            --source bw-board=/tmp/bw-board --source bw-circuit-ui=/tmp/bw-circuit-ui \
            --installed-root node_modules --installed-root packages/scratch-gui/node_modules
          node scripts/package-upstream-notices.mjs --check
      # The Pico simulator firmware (650 KB, sha256-pinned, never committed) is
      # fetched into static/ so webpack serves it. TOLERATED ABSENT by name: if
      # the fetch fails (network), the execute gate below SKIPS and the absent
      # gate still runs — the same contract labwired-wasm has.
      - name: Fetch the Pico MicroPython firmware for the sim gate (tolerated absent)
        id: bw_browser_audit_0013
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' }}
        run: npm run sync:picomicropython || echo "pico firmware sync failed — the execute gate will skip; the absent gate still runs"
      - name: Restore the sha256-pinned MakeCode runtime tarballs from cache (browser)
        id: bw_browser_audit_0014
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
