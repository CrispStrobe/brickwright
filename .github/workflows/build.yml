      # BSD-3 app on 2026-09-07, the default reaches the hosted compiler — and
      # the app must SAY so and name the way back. Until now that direction was
      # asserted only in unit tests, which is how a silent hosted round trip got
      # reintroduced through a second setting and was caught by a gate rather
