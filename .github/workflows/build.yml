        # different defects — wrong scale, wrong offset, stale content — and
        # comparing before-fullscreen with after-fullscreen conflates all three,
        # because fullscreen changes all of them at once. This drives probes
        # between them that each change exactly one thing, and prints ONE named
        # verdict. "None of the three fired" is a first-class outcome with its
