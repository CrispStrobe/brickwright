        # in the gate header, plan P6 and the LANES row.
        #
        # NOT MEASURED YET, unlike its neighbours: new gate, one assemble-and-boot
        # cycle. Replace with a measured max once the timing job has seen it.
        timeout-minutes: 3  # derived: p95 4 s × 3 → 3 min over 20 green runs to 36823340082; max 5 s in run 36550481517 (gen-gate-budgets.mjs)
        id: chip_refusal_line
