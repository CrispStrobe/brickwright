      - name: Browser gate — offline 8051 compile and debugger evidence
        id: bw_browser_audit_0196
        timeout-minutes: 3  # derived: p95 6 s × 3 → 3 min over 20 green runs to 36823340082; max 8 s in run 35584668446 (gen-gate-budgets.mjs)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' && matrix.shard == 'light' }}
        run: PROOF_URL=http://localhost:8617/ node scripts/verify-debug-frames-watch.mjs

      # THE OTHER HALF OF THE SAME CONTRACT. The step above proves that a user
      # who OPTS IN compiles with no network. This one proves what happens to
