  # THE FLAG-ON BROWSER JOB, the open follow-up named in test/gate-coverage.test.mjs.
  #
  # Why it is a JOB and not a step in `browser`: that job's build is flag-OFF on
  # purpose (build.yml line ~167 says so — the flagged JSX parse guards that
  # path), and flag-on additionally needs the 75 MB @yowasp/yosys, because the
  # flag does not stop webpack RESOLVING the local tier (run 35185515757 died of
  # exactly that). Making `browser` flag-on would put that cost on both shards
  # and change the artifact 30 unrelated gates drive. Making it a third SHARD is
  # barred by the partition contract: test/browser-gate-shards.test.mjs holds
  # that setup steps carry no shard clause — every leg builds for itself — so
  # there is nowhere to hang a shard-conditional build. A separate job pays for
  # one more build and runs wholly in parallel, costing the run no wall clock.
  #
  # Its steps are deliberately NOT named "Browser gate — …": that prefix is how
  # scripts/lib/workflow-gates.mjs finds the ONE job holding the browser gates,
  # and a second holder makes gateJob() return null, which fails the shard tests
  # by name. The gate here carries its own timeout-minutes all the same.
  #
  # The gate SKIPS (exit 0) on a flag-off build so it stays safe to run by hand.
  # That escape is removed here with BW_FPGA_REQUIRE_SURFACE=1: this job builds
  # flag-on on purpose, so a missing tab is the loudest failure available, never
  # a green check that proves nothing.
  fpga-surface:
    name: fpga surface (flag-on)
    needs: [guard, scope]
    if: needs.guard.outputs.superseded != 'true' && needs.scope.outputs.thorough == 'true' && needs.scope.outputs.fpga == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install root package inputs before the flag-on integration
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vendor the pinned permissive Scratch sources for the flag-on build
        run: npm run vendor
      - name: Integrate the Code tab for the flag-on build
        run: node scripts/integrate.mjs
      - name: Install the GUI package inputs for the flag-on build
        run: cd packages/scratch-gui && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      # Flag-on webpack leaves @yowasp/yosys aliased to the REAL package (an off
      # build gets the yosys-absent stub), and resolution happens whether or not
      # DefinePlugin later drops the code — so the package must be here or the
      # build fails to resolve it. Same step the deployable build job carries.
      - name: Install the local FPGA toolchain (this build is flag-on)
        run: cd packages/scratch-gui && npm install --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund @yowasp/yosys
      - name: Apply the scratch-vm overlay for the flag-on build
        run: node scripts/apply-vm-overlay.mjs
      - name: Apply the scratch-paint overlay for the flag-on build
        run: node scripts/apply-paint-overlay.mjs
      - name: Apply the scratch-render overlay for the flag-on build
        id: fpga_overlays
        run: node scripts/apply-render-overlay.mjs
      # No BW_SYNTHESIS_ENDPOINT: this gate is the SURFACE, and it must not
      # depend on a live hosted service. Qualifying synthesis against the exact
      # deployable candidate stays verify-fpga-builder.mjs's manual job.
      - name: Build the editor flag-on
        id: build_editor_fpga
        if: ${{ !cancelled() && steps.fpga_overlays.outcome == 'success' }}
        run: cd packages/scratch-gui && NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 BW_ENABLE_FPGA=1 npm run build
      - name: Prepare official Ubuntu package mirror
        if: ${{ !cancelled() && steps.build_editor_fpga.outcome == 'success' }}
        run: sudo env "PATH=$PATH" node scripts/prepare-playwright-apt.mjs

      - name: Install Playwright browser for the flag-on drive
        id: fpga_playwright
        if: ${{ !cancelled() && steps.build_editor_fpga.outcome == 'success' }}
        run: |
          test -x ./node_modules/.bin/playwright
          # Keep the prior three-by-300-second setup budget. Privileged apt
          # children belong to the root-owned timeout group; browser downloads
          # remain unprivileged and share the remaining original budget.
          pw_install_deadline=$((SECONDS + 900))
          sudo env "PATH=$PATH" timeout --kill-after=15s 300 ./node_modules/.bin/playwright install-deps chromium
          ok=0
          for i in 1 2 3; do
            pw_remaining=$((pw_install_deadline - SECONDS))
            [ "$pw_remaining" -gt 0 ] || break
            pw_attempt=$((pw_remaining < 300 ? pw_remaining : 300))
            if timeout --kill-after=15s "$pw_attempt" ./node_modules/.bin/playwright install chromium; then ok=1; break; fi
            echo "playwright chromium install attempt $i failed/timed out; retrying"
            pw_remaining=$((pw_install_deadline - SECONDS))
            if [ "$pw_remaining" -gt 0 ]; then sleep "$((pw_remaining < 5 ? pw_remaining : 5))"; fi
          done
          [ "$ok" = 1 ] || { echo "::error::playwright chromium install failed after 3 attempts"; exit 1; }
      # The script serves the build itself (its own http server on 8631), so
      # there is no separate serve step and no shared port to go stale on.
      # Measured 2026-09-22 against the flag-on github-pages artifact of
      # a83ce3c27: 19 checks, ~95 s end to end. Budget 10 min.
      # A served build for the builder gate below, which requires PROOF_URL and
      # will not invent a server of its own — by design: its subject is an exact
      # served candidate. `python3 -m http.server` is the threaded CLI (see the
      # browser job's serve step for the measurement).
      - name: Serve the flag-on build
        id: fpga_serve
        if: ${{ !cancelled() && steps.build_editor_fpga.outcome == 'success' }}
        run: |
          python3 -m http.server 8632 --directory packages/scratch-gui/build &
          for i in $(seq 1 30); do curl -sf http://localhost:8632/ >/dev/null && break; sleep 1; done
      # NOT THE RELEASE RECEIPT, and the step name says so because the list this
      # gate just left said so. verify-fpga-builder.mjs's full form qualifies the
      # exact deployable candidate against the LIVE hosted synthesis service;
      # FPGA_SKIP_SYNTH=1 omits the synthesis round trip and the demo-circuit
      # journey entirely. What it still proves is worth running every time and is
      # covered nowhere else: that a design drawn on the visual canvas becomes
      # Verilog in the synthesis input. Qualifying a release still means running
      # this WITHOUT the flag, by hand, against the candidate URL:
      #   PROOF_URL=https://<exact-candidate>/ node scripts/verify-fpga-builder.mjs
      - name: FPGA gate — builder canvas to Verilog (NO synthesis; not the release receipt)
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.fpga_serve.outcome == 'success' }}
        env:
          FPGA_SKIP_SYNTH: '1'
          PROOF_URL: http://localhost:8632/
        run: node scripts/verify-fpga-builder.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.fpga_serve.outcome == 'success'
        with:
          name: fpga-builder-proof
          path: artifacts/fpga-builder/*
          if-no-files-found: warn
      # Two fingers on the gate canvas. The circuit designer's pinch was
      # written and never attached (bw-circuit-ui #50); this canvas is React
      # Flow, whose zoomOnPinch defaults to true, so it is BELIEVED to work.
      # Believed is not measured, and the integration can break what the
      # library provides — a touch-action on an ancestor, a preventDefault on
      # the wrapper, a panel mounted but never laid out. Driven with CDP touch
      # points, since Playwright's touchscreen taps with one finger and cannot
      # express a pinch.
      - name: FPGA gate — two fingers pinch the gate canvas
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.fpga_serve.outcome == 'success' }}
        env:
          PROOF_URL: http://localhost:8632/
        run: node scripts/verify-fpga-pinch.mjs

      - name: FPGA gate — the flag-on surface and the learning path
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.fpga_playwright.outcome == 'success' }}
        env:
          BW_FPGA_REQUIRE_SURFACE: '1'
        run: node scripts/verify-fpga-surface.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.fpga_playwright.outcome == 'success'
        with:
          name: fpga-surface-proof
          path: artifacts/fpga-surface/*
          if-no-files-found: warn


  arcade-numeric-authoring:
    name: Arcade numeric authoring (official build)
    if: needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'pull_request')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      BW_GUI_GIT_EXECUTABLE: /usr/bin/git
      BW_GUI_PRODUCER_RUNNER_V1: ${{ needs.build.outputs.gui_producer_runner_v1 }}
      BW_GUI_PRODUCER_RESULT: ${{ needs.build.result }}
      BW_GUI_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BW_GUI_REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Install gate inputs without building or syncing another SDK
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Admit completed producer and acquire sole original archive
        id: admitted_gui
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/admit-official-gui-artifact.mjs test-results/numeric-gui-admission --runner-producer-v1
      - name: Bind compiler to admitted artifact SDK
        env:
          BW_ADMITTED_SITE: ${{ steps.admitted_gui.outputs.site }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {mkdir,symlink,lstat,realpath} from 'node:fs/promises';
          import path from 'node:path';
          const parent=path.resolve('packages/scratch-gui/static');
          const expected=path.join(process.env.BW_ADMITTED_SITE,'static/makecode');
          const link=path.join(parent,'makecode');
          await mkdir(parent,{recursive:true});
          try {await lstat(link);assert.equal(await realpath(link),await realpath(expected),'Existing SDK must already be admitted SDK');}
          catch(error){if(error.code!=='ENOENT')throw error;await symlink(expected,link);}
          JS
      - name: Prepare official Ubuntu package mirror
        run: sudo env "PATH=$PATH" node scripts/prepare-playwright-apt.mjs
      - name: Install Playwright Chromium for production UI and original SDK
        run: npx --no-install playwright install --with-deps chromium
      - name: Serve the admitted original app
        env:
          BW_ADMITTED_SITE: ${{ steps.admitted_gui.outputs.site }}
        run: |
          python3 -m http.server 8617 --directory "$BW_ADMITTED_SITE" &
          echo "$!" > test-results/numeric-gui-admission/server.pid
          node --input-type=module - <<'JS'
          // Same 30-second readiness bound as the existing browser server.
          const deadline=Date.now()+30000;
          for(;;){
            let ready=false;try{ready=(await fetch('http://localhost:8617/',{signal:AbortSignal.timeout(Math.max(1,deadline-Date.now()))})).status===200;}catch{}
            if(ready)break;
            if(Date.now()>=deadline)throw new Error('Admitted site did not become ready');
            await new Promise(resolve=>setTimeout(resolve,100));
          }
          JS
      # pxt-node.mjs admits only the integrated GUI libraries with the pinned,
      # overlaid scratch-vm. Prepare that source tree; no frontend build.
      - name: Vendor the pinned permissive Scratch sources
        run: npm run vendor
      - name: Integrate the owned GUI libraries
        run: node scripts/integrate.mjs
      - name: Install the declared GUI dependencies
        run: |
          set -euo pipefail
          (cd packages/scratch-gui && npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund)
          git diff --exit-code -- packages/scratch-gui/package.json packages/scratch-gui/package-lock.json
          sha256sum packages/scratch-gui/package.json packages/scratch-gui/package-lock.json \
            packages/scratch-gui/node_modules/scratch-vm/src/index.js
          printf '%s  %s\n' \
            '814d2a96184f7b490905f25317197ec0dcea8128e234efcf3fe3f173f799300a' packages/scratch-gui/node_modules/bw-board/src/i8086.js \
            '3acf189088f4f11d16067d95c0be4a6cb91861d316799fa0a24edb607dfe6c4a' packages/scratch-gui/node_modules/bw-circuit-ui/package.json | sha256sum --check
      - name: Apply the scratch-vm overlay
        run: node scripts/apply-vm-overlay.mjs
      - name: Actual production IDE numeric/settings/source-loop authoring
        env:
          PROOF_URL: http://localhost:8617/
          BW_GUI_BUILD_RECEIPT: ${{ steps.admitted_gui.outputs.receiptPath }}
          BW_GUI_BUILD_ARCHIVE: ${{ steps.admitted_gui.outputs.archivePath }}
          BW_NUMERIC_GUI_REPORT_DIR: test-results/arcade-numeric-authoring-gui
        run: node --import ./scripts/lib/register-gui-scope.mjs scripts/verify-arcade-numeric-authoring-gui.mjs
      - name: Actual production IDE event and multiplayer authoring
        env:
          PROOF_URL: http://localhost:8617/
          BW_GUI_BUILD_RECEIPT: ${{ steps.admitted_gui.outputs.receiptPath }}
          BW_GUI_BUILD_ARCHIVE: ${{ steps.admitted_gui.outputs.archivePath }}
          BW_EVENT_GUI_REPORT_DIR: test-results/arcade-event-authoring-gui
        run: node --import ./scripts/lib/register-gui-scope.mjs scripts/verify-arcade-event-authoring-gui.mjs
      - name: Actual production IDE live font metric authoring
        env:
          PROOF_URL: http://localhost:8617/
          BW_GUI_BUILD_RECEIPT: ${{ steps.admitted_gui.outputs.receiptPath }}
          BW_GUI_BUILD_ARCHIVE: ${{ steps.admitted_gui.outputs.archivePath }}
          BW_FONT_GUI_REPORT_DIR: test-results/arcade-live-font-authoring-gui
        run: node --import ./scripts/lib/register-gui-scope.mjs scripts/verify-arcade-live-font-authoring-gui.mjs
      - name: Actual production IDE owned Image authoring
        env:
          PROOF_URL: http://localhost:8617/
