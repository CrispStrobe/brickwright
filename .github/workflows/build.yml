      - name: Build the editor
        id: build_editor_browser
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' && steps.browser_package_provenance.outcome == 'success' }}
        env:
          BW_ENABLE_CAD: ${{ startsWith(matrix.shard, 'light') && '1' || '0' }}
        run: cd packages/scratch-gui && NODE_ENV=production NODE_OPTIONS=--max-old-space-size=2560 npm run build

      - name: Guard — emitted native broker proof bytes retain reviewed authority
        id: bw_browser_audit_0017
        if: ${{ !cancelled() && steps.build_editor_browser.outcome == 'success' }}
        run: |
          node scripts/verify-emitted-native-broker-proof.mjs packages/scratch-gui/build
          node scripts/package-upstream-notices.mjs --check --build-dir packages/scratch-gui/build

      # Browser acceptance BEFORE the artifact leaves this job. The
      # 930000d incident shipped a wall-to-wall visual regression on
      # green unit tests — unit suites cannot see a lost theme, a
      # broken pane, or a dead button. These gates drive the ACTUAL
      # BUILT APP and block the deploy when it is visibly wrong.
      - name: Prepare official Ubuntu package mirror
        id: bw_browser_audit_0018
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' }}
        run: sudo env "PATH=$PATH" node scripts/prepare-playwright-apt.mjs

      - name: Install Playwright browser
        id: playwright
        if: ${{ !cancelled() && steps.overlays_browser.outcome == 'success' }}
        # Gate-only tool (the gates drive the built app), NOT an app dependency.
        # Installation is bounded and retried below, but failure remains a real
        # deployment failure: silently skipping every browser gate would turn
        # required acceptance evidence into a soft gate.
        # npm ci already installed the root's locked Playwright dependency.
        # Use that CLI directly; resolving it again adds an unnecessary registry
        # request and can fail before any browser acceptance runs.
        env:
          BW_BROWSER_SHARD: ${{ matrix.shard }}
        run: |
          browsers=(chromium)
          if [ "$BW_BROWSER_SHARD" = "robotview" ]; then browsers+=(firefox); fi
          # Playwright's chromium download can hang on a flaky mirror; with no
          # timeout a stalled download froze the whole deploy for ~90 min. Bound
          # each attempt and retry so it fails fast and recovers.
          test -x ./node_modules/.bin/playwright
          # Install apt dependencies once under a root-owned timeout group. A
          # timed-out sudo child otherwise retains the dpkg lock across retries.
          sudo env "PATH=$PATH" timeout --kill-after=15s 300 ./node_modules/.bin/playwright install-deps "${browsers[@]}"
          ok=0
          for i in 1 2 3; do
            if timeout --kill-after=15s 300 ./node_modules/.bin/playwright install "${browsers[@]}"; then ok=1; break; fi
            echo "playwright ${browsers[*]} install attempt $i failed/timed out; retrying"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::playwright ${browsers[*]} install failed after 3 attempts"; exit 1; }
