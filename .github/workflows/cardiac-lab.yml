      - 'packages/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/debug-panel.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/controller-panel*.jsx'
      - 'packages/scratch-gui/src/components/gui/gui.jsx'
      - 'packages/scratch-gui/src/components/gui/guided-lessons.*'
      - 'packages/scratch-gui/src/components/gui/lesson-waves/cardiac-*.json'
      - 'packages/scratch-gui/src/containers/lazy-pseudocode-importer.jsx'
      - 'packages/scratch-gui/src/containers/controls.jsx'
      - 'overlay/scratch-gui/src/lib/cardiac-*'
      - 'overlay/scratch-gui/src/lib/bw-debug/**'
      - 'overlay/scratch-gui/src/lib/bw-project-*'
