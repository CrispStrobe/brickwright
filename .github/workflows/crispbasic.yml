name: CrispBASIC native and WASM runtimes
on:
  push:
    branches: ['**']
    paths:
      - 'packages/crisp-basic/**'
      - 'overlay/scratch-gui/src/lib/crispbasic-*.js'
      - 'packages/scratch-gui/src/lib/crispbasic-*.js'
      - 'overlay/scratch-gui/src/lib/bw-cad-circuit/bridge.js'
      - 'packages/scratch-gui/src/lib/bw-cad-circuit/bridge.js'
      - 'overlay/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'packages/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'overlay/scratch-gui/src/lib/pico-sim-run.js'
      - 'packages/scratch-gui/src/lib/pico-sim-run.js'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'overlay/scratch-gui/src/lib/sb3-creator*.js'
      - 'packages/scratch-gui/src/lib/sb3-creator*.js'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/vdu-terminal.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/vdu-terminal.jsx'
      - 'overlay/scratch-gui/src/lib/codemirror-editor.jsx'
      - 'packages/scratch-gui/src/lib/codemirror-editor.jsx'
      - 'overlay/scratch-gui/webpack.config.js'
      - 'packages/scratch-gui/webpack.config.js'
      - 'packages/scratch-gui/package.json'
      - 'packages/scratch-gui/package-lock.json'
      - 'scripts/package-crispbasic.mjs'
      - 'scripts/verify-crispbasic-*.mjs'
      - 'scripts/lib/crispbasic-*.mjs'
      - 'scripts/integrate.mjs'
      - 'scripts/vendor.mjs'
      - 'scripts/apply-vm-overlay.mjs'
      - 'scripts/apply-paint-overlay.mjs'
      - 'scripts/apply-render-overlay.mjs'
      - 'vendor-pins.json'
      - 'bin/bwlite.mjs'
      - 'test/crispbasic-*.test.mjs'
      - 'test/circuit-cad-cancellation.test.mjs'
      - 'test/circuit-cad-bridge.test.mjs'
      - 'test/b8-one-board-per-run.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crispbasic.yml'
  pull_request:
    paths:
      - 'packages/crisp-basic/**'
      - 'overlay/scratch-gui/src/lib/crispbasic-*.js'
      - 'packages/scratch-gui/src/lib/crispbasic-*.js'
      - 'overlay/scratch-gui/src/lib/bw-cad-circuit/bridge.js'
      - 'packages/scratch-gui/src/lib/bw-cad-circuit/bridge.js'
      - 'overlay/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'packages/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'overlay/scratch-gui/src/lib/pico-sim-run.js'
      - 'packages/scratch-gui/src/lib/pico-sim-run.js'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'overlay/scratch-gui/src/lib/sb3-creator*.js'
      - 'packages/scratch-gui/src/lib/sb3-creator*.js'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/vdu-terminal.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/vdu-terminal.jsx'
      - 'overlay/scratch-gui/src/lib/codemirror-editor.jsx'
      - 'packages/scratch-gui/src/lib/codemirror-editor.jsx'
      - 'overlay/scratch-gui/webpack.config.js'
      - 'packages/scratch-gui/webpack.config.js'
      - 'packages/scratch-gui/package.json'
      - 'packages/scratch-gui/package-lock.json'
      - 'scripts/package-crispbasic.mjs'
      - 'scripts/verify-crispbasic-*.mjs'
      - 'scripts/lib/crispbasic-*.mjs'
      - 'scripts/integrate.mjs'
      - 'scripts/vendor.mjs'
      - 'scripts/apply-vm-overlay.mjs'
      - 'scripts/apply-paint-overlay.mjs'
      - 'scripts/apply-render-overlay.mjs'
      - 'vendor-pins.json'
      - 'bin/bwlite.mjs'
      - 'test/crispbasic-*.test.mjs'
      - 'test/circuit-cad-cancellation.test.mjs'
      - 'test/circuit-cad-bridge.test.mjs'
      - 'test/b8-one-board-per-run.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crispbasic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}${{ !(github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request')) && format('-isolated-{0}', github.run_id) || '' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/crisp-basic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm
      - name: Check source preparation
        run: npm test
      - name: Build the pinned headless core
        run: npm run build:native
      - name: Run real native runtime and CLI tests
        run: npm run test:native
      - name: Run the standalone example
        run: node bin/crispbasic.mjs examples/structured.bas --json
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/crisp-basic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check out the pinned SDK installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: emscripten-core/emsdk
          ref: a7c808831a666cc903fedb906c171a718cd97341
          path: packages/crisp-basic/.build/emsdk
          persist-credentials: false
      - name: Install the validated Emscripten toolchain
        run: |
          .build/emsdk/emsdk install 3.1.64
          .build/emsdk/emsdk activate 3.1.64
      - name: Install native parity and browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install Brickwright source integration dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build both real interpreter backends
        env:
          EMCC: ${{ github.workspace }}/packages/crisp-basic/.build/emsdk/upstream/emscripten/emcc
        run: |
          npm run build:native
          npm run build:wasm
      - name: Retain the pinned WASM build for integration qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crispbasic-wasm-${{ github.sha }}
          path: |
            packages/crisp-basic/.build/wasm/crispbasic.mjs
            packages/crisp-basic/.build/wasm/crispbasic.wasm
            packages/crisp-basic/.build/wasm/build.json
            packages/crisp-basic/.build/wasm/BBCSDL-LICENSE.txt
            packages/crisp-basic/.build/wasm/licenses/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify WASM lifecycle and restricted host operations
        run: npm run test:wasm
      - name: Compare both backends against fixed expected results
        run: npm run test:parity
      - name: Verify real browser workers and cleanup
        run: npm run test:browser
      - name: Package and verify the browser runtime assets
        working-directory: .
        run: |
          npm run package:crispbasic
          npm run package:crispbasic:check
      - name: Verify generated BASIC and Brickwright session integration
        run: npm run test:brickwright
      - name: Verify shared circuit ownership and existing CAD cancellation
        working-directory: .
        run: node --test test/circuit-cad-cancellation.test.mjs test/circuit-cad-bridge.test.mjs test/b8-one-board-per-run.test.mjs
      - name: Verify staged assets and Brickwright rendering in Chromium
        working-directory: .
        run: node scripts/verify-crispbasic-browser.mjs

  production:
    # This gate consumes the exact runtime already qualified above. It builds
    # and drives the complete webpack app; the focused React harness remains
    # a separate, faster test of editor/adapter lifecycle edge cases.
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Restore this run's qualified WASM build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crispbasic-wasm-${{ github.sha }}
          path: packages/crisp-basic/.build/wasm
      - name: Install the locked integration and browser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the ordinary production GUI sources
        run: |
          npm run vendor
          npm run integrate
      - name: Install the locked GUI dependencies
        # The committed lock already includes the real, pinned @yowasp/yosys
        # needed by the flag-on production build; do not replace its pin here.
        run: |
          npm --prefix packages/scratch-gui ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          git diff --exit-code -- packages/scratch-gui/package.json packages/scratch-gui/package-lock.json
      - name: Apply the ordinary VM, paint and render overlays
        run: |
          node scripts/apply-vm-overlay.mjs
          node scripts/apply-paint-overlay.mjs
          node scripts/apply-render-overlay.mjs
      - name: Verify the staged interpreter and production source prerequisites
        run: |
          npm run package:crispbasic:check
          npm run package:broker-proof-pins:check
          npm run package:broker-assets:check
          node scripts/check-flagged-jsx.mjs
      - name: Install Chromium for the production app
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build the complete production editor
        id: build_editor
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=2560
          BW_ENABLE_CAD: '1'
          BW_ENABLE_FPGA: '1'
          BW_SYNTHESIS_ENDPOINT: https://synth.crispstro.be/api
        # Optional external firmware/SDK downloads used by unrelated hardware
        # gates are not prerequisites for CrispBASIC; the standard app's
        # unavailable-engine paths remain intact. No source or UI is stubbed.
        run: |
          mkdir -p artifacts/crispbasic-production
          node -e 'console.log(JSON.stringify({commit: process.env.GITHUB_SHA, node: process.version, nodeEnv: process.env.NODE_ENV, cad: process.env.BW_ENABLE_CAD, fpga: process.env.BW_ENABLE_FPGA}, null, 2))' > artifacts/crispbasic-production/environment.json
          npm --prefix packages/scratch-gui run build 2>&1 | tee artifacts/crispbasic-production/build.log
      - name: Verify the emitted runtime's bytes and production asset boundary
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        run: node scripts/verify-crispbasic-production-assets.mjs 2>&1 | tee artifacts/crispbasic-production/assets.log
      - name: Drive the complete editor and Circuit in Chromium
        if: ${{ !cancelled() && steps.build_editor.outcome == 'success' }}
        timeout-minutes: 10
        run: node scripts/verify-crispbasic-production.mjs 2>&1 | tee artifacts/crispbasic-production/browser.log
      - name: Retain production qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crispbasic-production-${{ github.sha }}
          path: |
            artifacts/crispbasic-production/**
            packages/scratch-gui/build/brickwright-build.json
            packages/scratch-gui/build/static/crispbasic/manifest.json
          if-no-files-found: warn
          retention-days: 7
