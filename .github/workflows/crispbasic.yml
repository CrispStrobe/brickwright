name: CrispBASIC native and WASM runtimes
on:
  push:
    branches: ['**']
    paths:
      - 'packages/crisp-basic/**'
      - 'overlay/scratch-gui/src/lib/crispbasic-*.js'
      - 'packages/scratch-gui/src/lib/crispbasic-*.js'
      - 'overlay/scratch-gui/src/lib/bw-cad-circuit/bridge.js'
      - 'packages/scratch-gui/src/lib/bw-cad-circuit/bridge.js'
      - 'overlay/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'packages/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'overlay/scratch-gui/src/lib/pico-sim-run.js'
      - 'packages/scratch-gui/src/lib/pico-sim-run.js'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'overlay/scratch-gui/src/lib/sb3-creator*.js'
      - 'packages/scratch-gui/src/lib/sb3-creator*.js'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/vdu-terminal.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/vdu-terminal.jsx'
      - 'overlay/scratch-gui/webpack.config.js'
      - 'packages/scratch-gui/webpack.config.js'
      - 'scripts/package-crispbasic.mjs'
      - 'scripts/verify-crispbasic-browser.mjs'
      - 'scripts/lib/crispbasic-*.mjs'
      - 'scripts/integrate.mjs'
      - 'test/crispbasic-*.test.mjs'
      - 'test/circuit-cad-cancellation.test.mjs'
      - 'test/circuit-cad-bridge.test.mjs'
      - 'test/b8-one-board-per-run.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crispbasic.yml'
  pull_request:
    paths:
      - 'packages/crisp-basic/**'
      - 'overlay/scratch-gui/src/lib/crispbasic-*.js'
      - 'packages/scratch-gui/src/lib/crispbasic-*.js'
      - 'overlay/scratch-gui/src/lib/bw-cad-circuit/bridge.js'
      - 'packages/scratch-gui/src/lib/bw-cad-circuit/bridge.js'
      - 'overlay/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'packages/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'overlay/scratch-gui/src/lib/pico-sim-run.js'
      - 'packages/scratch-gui/src/lib/pico-sim-run.js'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/circuit-tab.jsx'
      - 'overlay/scratch-gui/src/lib/sb3-creator*.js'
      - 'packages/scratch-gui/src/lib/sb3-creator*.js'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/vdu-terminal.jsx'
      - 'packages/scratch-gui/src/components/tw-pseudocode/vdu-terminal.jsx'
      - 'overlay/scratch-gui/webpack.config.js'
      - 'packages/scratch-gui/webpack.config.js'
      - 'scripts/package-crispbasic.mjs'
      - 'scripts/verify-crispbasic-browser.mjs'
      - 'scripts/lib/crispbasic-*.mjs'
      - 'scripts/integrate.mjs'
      - 'test/crispbasic-*.test.mjs'
      - 'test/circuit-cad-cancellation.test.mjs'
      - 'test/circuit-cad-bridge.test.mjs'
      - 'test/b8-one-board-per-run.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crispbasic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}${{ !(github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request')) && format('-isolated-{0}', github.run_id) || '' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/crisp-basic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm
      - name: Check source preparation
        run: npm test
      - name: Build the pinned headless core
        run: npm run build:native
      - name: Run real native runtime and CLI tests
        run: npm run test:native
      - name: Run the standalone example
        run: node bin/crispbasic.mjs examples/structured.bas --json
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/crisp-basic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check out the pinned SDK installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: emscripten-core/emsdk
          ref: a7c808831a666cc903fedb906c171a718cd97341
          path: packages/crisp-basic/.build/emsdk
          persist-credentials: false
      - name: Install the validated Emscripten toolchain
        run: |
          .build/emsdk/emsdk install 3.1.64
          .build/emsdk/emsdk activate 3.1.64
      - name: Install native parity and browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install Brickwright source integration dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build both real interpreter backends
        env:
          EMCC: ${{ github.workspace }}/packages/crisp-basic/.build/emsdk/upstream/emscripten/emcc
        run: |
          npm run build:native
          npm run build:wasm
      - name: Retain the pinned WASM build for integration qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crispbasic-wasm-${{ github.sha }}
          path: |
            packages/crisp-basic/.build/wasm/crispbasic.mjs
            packages/crisp-basic/.build/wasm/crispbasic.wasm
            packages/crisp-basic/.build/wasm/build.json
            packages/crisp-basic/.build/wasm/BBCSDL-LICENSE.txt
            packages/crisp-basic/.build/wasm/licenses/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify WASM lifecycle and restricted host operations
        run: npm run test:wasm
      - name: Compare both backends against fixed expected results
        run: npm run test:parity
      - name: Verify real browser workers and cleanup
        run: npm run test:browser
      - name: Package and verify the browser runtime assets
        working-directory: .
        run: |
          npm run package:crispbasic
          npm run package:crispbasic:check
      - name: Verify generated BASIC and Brickwright session integration
        run: npm run test:brickwright
      - name: Verify shared circuit ownership and existing CAD cancellation
        working-directory: .
        run: node --test test/circuit-cad-cancellation.test.mjs test/circuit-cad-bridge.test.mjs test/b8-one-board-per-run.test.mjs
      - name: Verify staged assets and Brickwright rendering in Chromium
        working-directory: .
        run: node scripts/verify-crispbasic-browser.mjs
