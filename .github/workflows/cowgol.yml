name: Cowgol editor integration

on:
  push:
    branches: [main, feat/cowgol-integration-20261128]
    paths:
      - '.github/workflows/cowgol.yml'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/**'
      - 'overlay/scratch-gui/src/lib/bw-lang/cowgol*'
      - 'overlay/scratch-gui/src/lib/sb3-creator-cowgol*'
      - 'overlay/scratch-gui/src/lib/sb3-creator-riscv-console.js'
      - 'overlay/scratch-gui/src/lib/bw-matrix/**'
      - 'overlay/scratch-gui/src/lib/code-source-document.js'
      - 'test/cowgol-integration.test.mjs'
      - 'test/cowgol-platforms.test.mjs'
      - 'test/cowgol-native-surfaces.test.mjs'
      - 'test/bwlite-cowgol-cli.test.mjs'
      - 'bin/bwlite.mjs'
      - 'test/code-conversion-editor-ownership.test.mjs'
      - 'test/code-tab-run-via-blocks.test.mjs'
      - 'vendor-pins.json'
  pull_request:
    paths:
      - '.github/workflows/cowgol.yml'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/**'
      - 'overlay/scratch-gui/src/lib/bw-lang/cowgol*'
      - 'overlay/scratch-gui/src/lib/sb3-creator-cowgol*'
      - 'overlay/scratch-gui/src/lib/sb3-creator-riscv-console.js'
      - 'overlay/scratch-gui/src/lib/bw-matrix/**'
      - 'overlay/scratch-gui/src/lib/code-source-document.js'
      - 'test/cowgol-integration.test.mjs'
      - 'test/cowgol-platforms.test.mjs'
      - 'test/cowgol-native-surfaces.test.mjs'
      - 'test/bwlite-cowgol-cli.test.mjs'
      - 'bin/bwlite.mjs'
      - 'test/code-conversion-editor-ownership.test.mjs'
      - 'test/code-tab-run-via-blocks.test.mjs'
      - 'vendor-pins.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cowgol-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            overlay/scratch-gui/src
            scripts
            test
            bin
            packages/scratch-gui/src/lib
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the shared converter and its ZIP dependency
        run: |
          npm install --prefix .cowgol-deps --ignore-scripts --no-save --package-lock=false jszip@3.10.1
          ln -s .cowgol-deps/node_modules node_modules
          cp -R overlay/scratch-gui/src/lib/. packages/scratch-gui/src/lib/
      - name: Editor, persistence, machine visibility and native handoff
        run: >-
          node --test
          test/cowgol-integration.test.mjs
          test/cowgol-platforms.test.mjs
          test/cowgol-native-surfaces.test.mjs
          test/bwlite-cowgol-cli.test.mjs
          test/bwlite-cli.test.mjs
          test/code-conversion-editor-ownership.test.mjs
          test/code-tab-run-via-blocks.test.mjs
          test/code-device-languages.test.mjs
          test/code-source-document.test.mjs
          test/bw-matrix-schema.test.mjs
          test/editor-conversion-menu.test.mjs
