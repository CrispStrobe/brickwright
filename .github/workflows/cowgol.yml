name: Cowgol editor integration

on:
  push:
    branches: [main, feat/cowgol-integration-20261128]
    paths:
      - '.github/workflows/cowgol.yml'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/**'
      - 'overlay/scratch-gui/src/lib/bw-lang/cowgol*'
      - 'overlay/scratch-gui/src/lib/sb3-creator-cowgol*'
      - 'overlay/scratch-gui/src/lib/sb3-creator-riscv-console.js'
      - 'overlay/scratch-gui/src/lib/bw-matrix/**'
      - 'overlay/scratch-gui/src/lib/code-source-document.js'
      - 'overlay/scratch-gui/src/lib/bw-machines/**'
      - 'overlay/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'overlay/scratch-gui/src/lib/bw-debug/i80386-dos-bench.js'
      - 'overlay/scratch-gui/static/roms/cpm*.bin'
      - 'overlay/scratch-gui/static/dos/msdos200-base.img'
      - 'test/cowgol-integration.test.mjs'
      - 'test/cowgol-platforms.test.mjs'
      - 'test/cowgol-native-surfaces.test.mjs'
      - 'test/cowgol-download-surfaces.test.mjs'
      - 'test/cowgol-dos-surfaces.test.mjs'
      - 'test/cowgol-i80386-surfaces.test.mjs'
      - 'test/cowgol-dos-disk.test.mjs'
      - 'test/bwlite-cowgol-cli.test.mjs'
      - 'test/bwlite-cowgol-build.test.mjs'
      - 'test/cowgol-computer-surfaces.test.mjs'
      - 'test/cowgol-cpm-launch-ownership.test.mjs'
      - 'test/debug-panel-runner-ownership.test.mjs'
      - 'test/machine-library-launch.test.mjs'
      - 'test/machine-media-order.test.mjs'
      - 'scripts/bw-cowgol.mjs'
      - 'scripts/verify-cowgol*.mjs'
      - 'bin/bwlite.mjs'
      - 'test/code-conversion-editor-ownership.test.mjs'
      - 'test/code-tab-run-via-blocks.test.mjs'
      - 'vendor-pins.json'
  pull_request:
    paths:
      - '.github/workflows/cowgol.yml'
      - 'overlay/scratch-gui/src/components/tw-pseudocode/**'
      - 'overlay/scratch-gui/src/lib/bw-lang/cowgol*'
      - 'overlay/scratch-gui/src/lib/sb3-creator-cowgol*'
      - 'overlay/scratch-gui/src/lib/sb3-creator-riscv-console.js'
      - 'overlay/scratch-gui/src/lib/bw-matrix/**'
      - 'overlay/scratch-gui/src/lib/code-source-document.js'
      - 'overlay/scratch-gui/src/lib/bw-machines/**'
      - 'overlay/scratch-gui/src/lib/bw-debug/debug-runner.js'
      - 'overlay/scratch-gui/src/lib/bw-debug/i80386-dos-bench.js'
      - 'overlay/scratch-gui/static/roms/cpm*.bin'
      - 'overlay/scratch-gui/static/dos/msdos200-base.img'
      - 'test/cowgol-integration.test.mjs'
      - 'test/cowgol-platforms.test.mjs'
      - 'test/cowgol-native-surfaces.test.mjs'
      - 'test/cowgol-download-surfaces.test.mjs'
      - 'test/cowgol-dos-surfaces.test.mjs'
      - 'test/cowgol-i80386-surfaces.test.mjs'
      - 'test/cowgol-dos-disk.test.mjs'
      - 'test/bwlite-cowgol-cli.test.mjs'
      - 'test/bwlite-cowgol-build.test.mjs'
      - 'test/cowgol-computer-surfaces.test.mjs'
      - 'test/cowgol-cpm-launch-ownership.test.mjs'
      - 'test/debug-panel-runner-ownership.test.mjs'
      - 'test/machine-library-launch.test.mjs'
      - 'test/machine-media-order.test.mjs'
      - 'scripts/bw-cowgol.mjs'
      - 'scripts/verify-cowgol*.mjs'
      - 'bin/bwlite.mjs'
      - 'test/code-conversion-editor-ownership.test.mjs'
      - 'test/code-tab-run-via-blocks.test.mjs'
      - 'vendor-pins.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cowgol-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            overlay/scratch-gui/src
            overlay/scratch-gui/examples/01-blink
            overlay/scratch-gui/static/dos
            scripts
            test
            bin
            packages/scratch-gui/src/lib
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the shared converter and its ZIP dependency
        run: |
          npm install --prefix .cowgol-deps --ignore-scripts --no-save --package-lock=false jszip@3.10.1 @babel/parser@7.28.5
          ln -s .cowgol-deps/node_modules node_modules
          cp -R overlay/scratch-gui/src/lib/. packages/scratch-gui/src/lib/
      - name: Parse the complete editor JSX
        run: >-
          node -e "require('@babel/parser').parse(require('node:fs').readFileSync('overlay/scratch-gui/src/components/tw-pseudocode/pseudocode-importer.jsx','utf8'),{sourceType:'module',plugins:['jsx']})"
      - name: Editor, persistence, machine visibility and native handoff
        run: >-
          node --test
          test/cowgol-integration.test.mjs
          test/cowgol-platforms.test.mjs
          test/cowgol-native-surfaces.test.mjs
          test/cowgol-download-surfaces.test.mjs
          test/cowgol-dos-surfaces.test.mjs
          test/cowgol-i80386-surfaces.test.mjs
          test/cowgol-dos-disk.test.mjs
          test/cowgol-computer-surfaces.test.mjs
          test/cowgol-cpm-launch-ownership.test.mjs
          test/debug-panel-runner-ownership.test.mjs
          test/machine-library-launch.test.mjs
          test/machine-media-order.test.mjs
          test/bwlite-cowgol-cli.test.mjs
          test/bwlite-cowgol-build.test.mjs
          test/bwlite-cli.test.mjs
          test/code-conversion-editor-ownership.test.mjs
          test/code-tab-run-via-blocks.test.mjs
          test/code-device-languages.test.mjs
          test/code-source-document.test.mjs
          test/bw-matrix-schema.test.mjs
          test/editor-conversion-menu.test.mjs
  native-cli-and-cpm-system:
    # Legacy zmac uses pre-C23 declarations; keep the GCC 13 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            overlay/scratch-gui/src/lib
            overlay/scratch-gui/static/roms
            overlay/scratch-gui/static/dos
            scripts
            bin
            packages/scratch-gui/src/lib
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout the qualified compiler service
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/stc-compiler
          ref: 597b52f7464313c9774206e570ee8ee47a667a16
          path: _stc_compiler
      - name: Checkout its exact Cowgol source
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/cowgol
          ref: 89b13e71030f929b40f82018a19b5b3386650342
          path: _cowgol
      - name: Checkout the exact GUI machine
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/bw-board
          ref: d21d6d8b819263eb08231134b7556efa82289a90
          path: _bw_board
      - name: Prepare the native compiler and local HTTP service
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build lua5.4 bison flex gpp moreutils nasm
          python3 -m pip install --quiet fastapi pydantic uvicorn
          python3 _stc_compiler/scripts/build-cowgol-bundle.py --source _cowgol --targets cowgol-cgen z80-cpm i8080-cpm dos
      - name: Build through the real CLI and execute CP/M, four DOS CPUs, booted MS-DOS and C
        run: |
          mkdir -p test-results
          node scripts/verify-cowgol-platforms.mjs --service _stc_compiler --bundle _stc_compiler/vendor/cowgol --board _bw_board --targets z80-cpm,i8080-cpm,dos,cowgol-cgen --cli --tmpdir "$RUNNER_TEMP" > test-results/cowgol-native-surfaces.json
      - uses: actions/upload-artifact@v4
        with:
          name: cowgol-native-surfaces
          path: test-results/cowgol-native-surfaces.json
  native-cli-and-avr:
    runs-on: ubuntu-latest
    container: python:3.11-bullseye
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            overlay/scratch-gui/src/lib
            scripts
            bin
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout the qualified compiler service
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/stc-compiler
          ref: 597b52f7464313c9774206e570ee8ee47a667a16
          path: _stc_compiler
      - name: Checkout its exact Cowgol source and AVR runner
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/cowgol
          ref: 89b13e71030f929b40f82018a19b5b3386650342
          path: _cowgol
      - name: Checkout the exact GUI AVR engine
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/avr8js
          ref: feea84c43e36e578841b5fce640202823b69b7f7
          path: _avr8js
      - name: Prepare the native compiler and local HTTP service
        run: |
          cp _stc_compiler/scripts/cowgol-bullseye.list /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends build-essential git
          python3 -m pip install --quiet fastapi pydantic uvicorn
          python3 _stc_compiler/scripts/build-cowgol-bundle.py --source _cowgol --targets atmega328p arduino-nano atmega168p
      - name: Build through the real CLI and cold-boot Uno, Nano and ATmega168P
        run: |
          mkdir -p test-results
          node scripts/verify-cowgol-platforms.mjs --service _stc_compiler --bundle _stc_compiler/vendor/cowgol --targets atmega328p,arduino-nano,atmega168p --avr8js-root _avr8js --avr-runner _cowgol/tests/avr-run.mjs --cli --tmpdir "$RUNNER_TEMP" > test-results/cowgol-native-avr-surfaces.json
      - uses: actions/upload-artifact@v4
        with:
          name: cowgol-native-avr-surfaces
          path: test-results/cowgol-native-avr-surfaces.json
