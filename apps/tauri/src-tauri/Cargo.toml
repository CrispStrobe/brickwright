[package]
name = "brickwright-tauri"
version = "0.1.34"
description = "Brickwright native app (Tauri 2, all platforms)"
authors = ["CrispStrobe"]
edition = "2021"
rust-version = "1.77"

# The `_lib` library is what Tauri's mobile entry point links against; the
# `main.rs` binary is desktop-only and just calls into it.
[lib]
name = "brickwright_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

# `devtools` ships the web inspector in release builds too (brickwright-ios had a
# web-inspector toggle); it's an educational tool, so the inspector staying
# available is a feature, not a leak.
[dependencies]
tauri = { version = "2", features = ["devtools"] }
# Exact permissive fork pin. Upstream 0.5.3 synchronously waits for BlueZ and panics from init()
# when Bluetooth is absent; this adds the backwards-compatible nonblocking initializer used below.
tauri-plugin-blec = { git = "https://github.com/CrispStrobe/tauri-plugin-blec", rev = "d22466eef77128ec08a47283d6bbc5f81f269367" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
# Open external links (help/credits/docs) in the system browser instead of
# hijacking the editor webview. See overlay/.../tauri-bridge.js.
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
getrandom = "0.2"
# On-demand asset/model downloads. rustls to stay OpenSSL-free / permissive
# across all platforms incl. mobile; `stream` for byte-progress on the one-file
# library pack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Extract the one-file library pack (Option C — a single CC BY-SA zip instead of
# ~1300 individual CDN requests).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Project documents (src/fileio.rs): Save refuses to overwrite a file that changed on disk
# since it was opened, which it detects by digest. Also used by the desktop SPIKE flash store.
sha2 = "0.10"
# Peer sessions (task E11, docs/PEERS-SECURITY-REVIEW.md): only with the `peers` feature below,
# which is OFF by default. RustCrypto crates, MIT OR Apache-2.0.
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }

# Mobile-only: OS share sheet (sender side of the project share round-trip).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-share = "2"

# Apple-only: the REFERENCE Scratch Link (BSD-3, Scratch Foundation) as a fifth
# connection path. Swift/CoreBluetooth, so iOS only — Android keeps using
# scratchlink/ble.rs and bt_android.rs.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-scratchlink-original = { path = "plugins/scratchlink-original" }
tauri-plugin-depth-capture = { path = "plugins/depth-capture" }

# Desktop-only: USB-CDC serial to a MicroPython Pico (src/pico.rs). Phones
# have no USB host serial we can reach, and the crate does not build there.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
serialport = "4"
command-group = "5.0.1"
# Cross-process private flash-store lock (MIT OR Apache-2.0), compatible with MSRV 1.77.
fs2 = "=0.4.3"

# Unix no-follow file opens for the host-owned flash journal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux Bluetooth-Classic (RFCOMM/SPP) backend, for EV3 + legacy SPIKE.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }

# Windows Bluetooth-Classic (RFCOMM/SPP) backend via WinRT.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Networking",
    "Networking_Sockets",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

# Android Bluetooth-Classic (RFCOMM/SPP) via JNI into android.bluetooth.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# 2.0.5's iOS UIActivityViewController has no popover anchor, which makes every
# share crash on iPad. Keep the exact permissive upstream crate locally with
# the minimal Swift repair in vendor/tauri-plugin-share/ios/Sources.
[patch.crates-io]
tauri-plugin-share = { path = "vendor/tauri-plugin-share" }

[features]
# Used by the desktop entrypoint (main.rs) to avoid the extra console window.
custom-protocol = ["tauri/custom-protocol"]
# LAN peer sessions (task E11). NOT a default feature, and it must never become one without a
# new review: docs/PEERS-SECURITY-REVIEW.md. With it off there is no listener, no peer command
# and no peer capability (test/peers-gate.test.mjs). Build with `--features peers`, and build
# the web side with BW_ENABLE_PEERS=1, or the app carries one half without the other.
peers = ["dep:chacha20poly1305", "dep:hkdf", "tokio/io-util", "tokio/time"]
